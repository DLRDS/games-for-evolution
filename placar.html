<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0D0D0D">
<title>Level BT · Placar de transmissão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Black&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  :root{
    --orange:#FF6600; --ink:#0D0D0D; --surf:#1A1A1A; --line:#2A2A2A;
    --label:#A8A8A8; --dim:#6B6B6B; --white:#FFFFFF; --danger:#FF4D4D;
    --fd:'Archivo Black',sans-serif; --fb:'Archivo',sans-serif; --fm:'JetBrains Mono',monospace;
  }
  body{font-family:var(--fb);background:var(--ink);color:var(--white);font-size:16px;-webkit-font-smoothing:antialiased;}
  button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;}
  input,select{font:inherit;color:inherit;}

  /* ═════════ MODO CONTROLE (celular) ═════════ */
  .wrap{max-width:520px;margin:0 auto;padding:20px 20px calc(24px + env(safe-area-inset-bottom));padding-top:calc(20px + env(safe-area-inset-top));}
  .lock{display:flex;align-items:center;gap:9px;margin-bottom:20px;}
  .meter{display:flex;align-items:flex-end;gap:3px;height:20px;}
  .meter i{width:5px;border-radius:999px;background:var(--line);display:block;}
  .meter i.on{background:var(--orange);}
  .lock-word{font-family:var(--fd);font-size:19px;letter-spacing:-.03em;}
  .lock-word b{color:var(--orange);font-weight:inherit;}
  .h1{font-family:var(--fd);font-size:28px;letter-spacing:-.03em;line-height:1.1;}
  .mono{font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--label);}
  .body-sm{font-size:14px;color:var(--label);}
  .card{background:var(--surf);border-radius:20px;padding:16px;}
  .panel{background:var(--surf);border-radius:24px;padding:20px;}
  .stack{display:flex;flex-direction:column;gap:12px;}
  .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
  .field{display:flex;flex-direction:column;gap:8px;}
  .field>label{font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--label);}
  .input{background:var(--surf);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;font-size:16px;color:var(--white);width:100%;outline:none;}
  .input:focus{border-color:var(--orange);}
  .input::placeholder{color:var(--dim);}
  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;padding:16px 22px;font-size:16px;font-weight:700;}
  .btn:active{transform:scale(.97);} .btn:disabled{opacity:.4;}
  .btn-p{background:var(--orange);color:var(--ink);}
  .btn-q{border:1.75px solid var(--line);color:var(--white);font-weight:600;padding:14px 20px;}
  .btn-full{width:100%;}
  .seg{display:flex;background:var(--surf);border-radius:999px;padding:5px;gap:6px;}
  .seg button{flex:1;border-radius:999px;padding:10px;font-family:var(--fd);font-size:16px;color:var(--label);}
  .seg button.on{background:var(--white);color:var(--ink);}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .hidden{display:none !important;}
  .tap{background:var(--surf);border-radius:20px;padding:20px;text-align:left;width:100%;}
  .tap.lead{border:1.5px solid var(--orange);}
  .big{font-family:var(--fd);font-size:64px;line-height:.85;letter-spacing:-.04em;}
  .warn{background:rgba(255,102,0,.12);border:1.5px solid var(--orange);border-radius:16px;padding:14px 16px;font-size:14px;}

  /* ═════════ MODO OVERLAY (OBS · 1920×1080) ═════════ */
  body.ov{background:transparent;overflow:hidden;}
  .stage{position:fixed;inset:0;width:1920px;height:1080px;transform-origin:top left;}
  .ov *{font-kerning:none;}

  /* — SCOREBUG — */
  .bug{position:absolute;left:64px;top:56px;display:flex;gap:3px;align-items:stretch;
    opacity:0;transform:translateX(-40px);animation:bugIn .5s cubic-bezier(.2,.9,.3,1) .1s forwards;}
  @keyframes bugIn{to{opacity:1;transform:translateX(0);}}
  .bug.out{animation:bugOut .35s ease forwards;}
  @keyframes bugOut{to{opacity:0;transform:translateX(-40px);}}

  .mk{background:var(--ink);padding:20px 22px;display:flex;flex-direction:column;gap:12px;justify-content:center;}
  .mk .meter{height:26px;gap:4px;}
  .mk .meter i{width:7px;}
  .mk .wm{font-family:var(--fd);font-size:24px;letter-spacing:-.03em;color:var(--white);}
  .mk .wm b{color:var(--orange);font-weight:inherit;}

  .nms{background:var(--surf);width:560px;display:flex;flex-direction:column;gap:3px;}
  .nrow{padding:16px 26px;display:flex;align-items:center;gap:20px;background:var(--surf);flex:1;}
  .dot{width:16px;height:16px;border-radius:999px;background:var(--line);flex-shrink:0;transition:background .2s,box-shadow .2s;}
  .nrow.srv .dot{background:var(--orange);box-shadow:0 0 16px rgba(255,102,0,.85);}
  .nnm{font-family:var(--fd);font-size:38px;letter-spacing:-.02em;color:var(--white);flex:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .setbox{display:flex;gap:10px;}
  .setbox span{width:34px;height:34px;display:flex;align-items:center;justify-content:center;
    font-family:var(--fm);font-size:24px;background:var(--line);color:var(--label);}
  .setbox span.won{background:var(--orange);color:var(--ink);font-weight:700;}
  .setbox span.lost{background:var(--line);color:var(--white);font-weight:700;}

  .col{display:flex;flex-direction:column;gap:3px;}
  .gm{background:var(--surf);width:92px;flex:1;display:flex;align-items:center;justify-content:center;
    font-family:var(--fd);font-size:40px;letter-spacing:-.03em;color:var(--white);}
  .ptcol{position:relative;}
  .pt{background:var(--surf);width:132px;flex:1;display:flex;align-items:center;justify-content:center;
    font-family:var(--fd);font-size:46px;letter-spacing:-.04em;color:var(--orange);}
  .ptmark{position:absolute;left:0;right:0;height:calc(50% - 1.5px);border:3px solid var(--orange);
    pointer-events:none;transition:top .25s cubic-bezier(.3,1,.4,1);}

  .bump{animation:bump .32s cubic-bezier(.2,1.4,.4,1);}
  @keyframes bump{0%{transform:scale(1)}38%{transform:scale(1.26)}100%{transform:scale(1)}}

  /* — PÍLULAS ABAIXO DO BUG — */
  .pills{position:absolute;left:64px;top:216px;display:flex;gap:10px;
    opacity:0;animation:bugIn .5s cubic-bezier(.2,.9,.3,1) .25s forwards;}
  .pl{padding:10px 16px;font-family:var(--fm);font-size:24px;letter-spacing:.14em;display:flex;align-items:center;gap:9px;}
  .pl-live{background:var(--orange);color:var(--ink);font-weight:700;}
  .pl-live i{width:10px;height:10px;border-radius:999px;background:var(--ink);display:block;animation:blink 1.3s infinite;}
  @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}
  .pl-dark{background:var(--ink);color:var(--white);}

  /* — RODAPÉ DE SETS — */
  .setline{position:absolute;left:64px;bottom:56px;background:var(--ink);padding:14px 20px;
    font-family:var(--fm);font-size:24px;letter-spacing:.14em;color:var(--label);
    opacity:0;animation:bugIn .5s ease .35s forwards;}

  /* — SELO DE TENSÃO (direita) — */
  .tens{position:absolute;right:64px;top:300px;display:flex;flex-direction:column;align-items:flex-end;
    opacity:0;transform:translateX(50px);pointer-events:none;}
  .tens.show{animation:tensIn .5s cubic-bezier(.2,1.15,.3,1) forwards;}
  @keyframes tensIn{to{opacity:1;transform:translateX(0);}}
  .tens.hide{animation:tensOut .35s ease forwards;}
  @keyframes tensOut{to{opacity:0;transform:translateX(50px);}}
  .tens .big{background:var(--orange);padding:22px 34px 26px;font-family:var(--fd);font-size:128px;
    line-height:.86;letter-spacing:-.05em;color:var(--ink);text-align:right;}
  .tens .sub{background:var(--ink);padding:16px 24px;font-family:var(--fm);font-size:30px;font-weight:700;
    letter-spacing:.18em;color:var(--white);}

  /* — QUEBRA DE SAQUE (canto inferior esquerdo) — */
  .brk{position:absolute;left:64px;bottom:96px;display:flex;flex-direction:column;gap:3px;align-items:flex-start;
    opacity:0;transform:translateY(30px);pointer-events:none;}
  .brk.show{animation:brkIn .45s cubic-bezier(.2,1.15,.3,1) forwards;}
  @keyframes brkIn{to{opacity:1;transform:translateY(0);}}
  .brk.hide{animation:brkOut .35s ease forwards;}
  @keyframes brkOut{to{opacity:0;transform:translateY(30px);}}
  .brk .w1{background:var(--ink);padding:18px 24px;font-family:var(--fd);font-size:44px;letter-spacing:-.03em;color:var(--orange);}
  .brk .w2{background:var(--ink);padding:22px 24px;font-family:var(--fm);font-size:28px;letter-spacing:.16em;color:var(--label);}

  /* — CARTELA DE ABERTURA DA PARTIDA — */
  .ident{position:absolute;left:64px;bottom:96px;display:flex;flex-direction:column;align-items:flex-start;
    opacity:0;transform:translateY(36px);}
  .ident.show{animation:brkIn .55s cubic-bezier(.2,1.1,.3,1) forwards;}
  .ident.hide{animation:brkOut .4s ease forwards;}
  .ident .torn{background:var(--orange);padding:12px 22px;font-family:var(--fm);font-size:26px;font-weight:700;letter-spacing:.2em;color:var(--ink);}
  .ident .box{background:var(--ink);padding:24px 28px 26px;display:flex;flex-direction:column;gap:16px;}
  .ident .cat{font-family:var(--fd);font-size:84px;line-height:.9;letter-spacing:-.04em;color:var(--white);}
  .ident .fase{font-family:var(--fd);font-size:56px;line-height:.9;letter-spacing:-.03em;color:var(--orange);}
  .ident .bar{background:var(--orange);height:4px;}
  .ident .meta{font-family:var(--fm);font-size:26px;letter-spacing:.16em;color:var(--label);display:flex;gap:24px;}
  .brandTR{position:absolute;right:64px;top:56px;background:var(--ink);padding:16px 22px;display:flex;align-items:center;gap:16px;}

  /* — FIM DE JOGO — */
  .veil{position:absolute;inset:0;background:rgba(13,13,13,.6);opacity:0;}
  .fim{position:absolute;left:64px;right:64px;top:140px;display:flex;flex-direction:column;gap:26px;opacity:0;transform:translateY(30px);}
  .veil.show{animation:fadeIn .5s ease forwards;}
  @keyframes fadeIn{to{opacity:1}}
  .fim.show{animation:brkIn .6s cubic-bezier(.2,1.05,.3,1) .12s forwards;}
  .fim .hd{display:flex;align-items:center;gap:18px;}
  .fim .hd .tag{background:var(--orange);padding:12px 22px;font-family:var(--fm);font-size:28px;font-weight:700;letter-spacing:.2em;color:var(--ink);}
  .fim .hd .ctx{font-family:var(--fm);font-size:26px;letter-spacing:.16em;color:var(--white);}
  .fim .box{background:var(--ink);padding:34px 34px 36px;display:flex;flex-direction:column;gap:24px;}
  .fim .ln{display:flex;align-items:center;gap:28px;}
  .fim .who{font-family:var(--fd);font-size:88px;line-height:.92;letter-spacing:-.045em;flex:1;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fim .ln.win .who{color:var(--white);} .fim .ln.lose .who{color:var(--label);}
  .fim .sets{display:flex;gap:10px;}
  .fim .sets span{width:108px;height:108px;display:flex;align-items:center;justify-content:center;
    font-family:var(--fd);font-size:64px;letter-spacing:-.04em;background:var(--line);color:var(--white);}
  .fim .sets span.w{background:var(--orange);color:var(--ink);}
  .fim .vc{background:var(--orange);padding:10px 18px;font-family:var(--fm);font-size:26px;font-weight:700;letter-spacing:.16em;color:var(--ink);}
  .fim .vd{padding:10px 18px;font-family:var(--fm);font-size:26px;letter-spacing:.16em;color:var(--dim);}
  .fim .rule{background:var(--line);height:3px;}
  .fim .ft{font-family:var(--fm);font-size:26px;letter-spacing:.16em;color:var(--white);display:flex;gap:16px;}
  .fim .ft b{color:var(--orange);font-weight:400;}
</style>
</head>
<body>

<!-- ════════ OVERLAY (OBS) ════════ -->
<div class="stage hidden" id="stage">
  <div class="veil" id="ovVeil"></div>

  <div class="bug" id="bug">
    <div class="mk">
      <div class="meter" aria-hidden="true"><i class="on" style="height:11px"></i><i class="on" style="height:17px"></i><i class="on" style="height:22px"></i><i style="height:26px"></i></div>
      <div class="wm">LEVEL<b>BT</b></div>
    </div>
    <div class="nms">
      <div class="nrow" id="ovR1"><span class="dot"></span><div class="nnm" id="ovN1">—</div><div class="setbox" id="ovB1"></div></div>
      <div class="nrow" id="ovR2"><span class="dot"></span><div class="nnm" id="ovN2">—</div><div class="setbox" id="ovB2"></div></div>
    </div>
    <div class="col"><div class="gm" id="ovG1">0</div><div class="gm" id="ovG2">0</div></div>
    <div class="col ptcol">
      <div class="ptmark" id="ovMark" style="top:0"></div>
      <div class="pt" id="ovP1">0</div><div class="pt" id="ovP2">0</div>
    </div>
  </div>

  <div class="pills" id="ovPills">
    <span class="pl pl-live"><i></i>AO VIVO</span>
    <span class="pl pl-dark" id="ovCtx"></span>
  </div>
  <div class="setline" id="ovSetline"></div>

  <div class="tens" id="ovTens"><div class="big" id="ovTensBig"></div><div class="sub" id="ovTensSub"></div></div>

  <div class="brk" id="ovBrk"><div class="w1">QUEBROU</div><div class="w2" id="ovBrkSub"></div></div>

  <div class="ident" id="ovIdent">
    <div class="torn" id="idTorn"></div>
    <div class="box">
      <div class="cat" id="idCat"></div>
      <div class="fase" id="idFase"></div>
      <div class="bar"></div>
      <div class="meta" id="idMeta"></div>
    </div>
  </div>
  <div class="brandTR hidden" id="ovBrandTR">
    <div class="meter" aria-hidden="true"><i class="on" style="height:11px"></i><i class="on" style="height:17px"></i><i class="on" style="height:22px"></i><i style="height:26px"></i></div>
    <div style="font-family:var(--fd);font-size:24px;letter-spacing:-.03em">LEVEL<span style="color:var(--orange)">BT</span></div>
  </div>

  <div class="fim" id="ovFim">
    <div class="hd"><span class="tag">FIM DE JOGO</span><span class="ctx" id="fCtx"></span></div>
    <div class="box">
      <div class="ln win"><div class="who" id="fW1"></div><div class="sets" id="fS1"></div><span class="vc">VENCEU</span></div>
      <div class="rule"></div>
      <div class="ln lose"><div class="who" id="fW2"></div><div class="sets" id="fS2"></div><span class="vd">—</span></div>
    </div>
    <div class="ft" id="fFt"></div>
  </div>
</div>

<!-- ════════ CONTROLE (celular) ════════ -->
<div class="wrap hidden" id="ctrl">
  <div class="lock">
    <div class="meter" aria-hidden="true"><i class="on" style="height:9px"></i><i class="on" style="height:13px"></i><i class="on" style="height:17px"></i><i style="height:20px"></i></div>
    <div class="lock-word">LEVEL<b>BT</b></div>
  </div>

  <!-- SETUP -->
  <div id="setup">
    <div class="h1" style="margin-bottom:8px">PLACAR DE<br>TRANSMISSÃO</div>
    <div class="body-sm" style="margin-bottom:22px">Monta a partida, marca o ponto no celular e o placar aparece no OBS.</div>
    <div class="stack">
      <div class="panel stack" style="gap:14px">
        <div class="mono">Dupla 1</div>
        <input class="input" id="a1" placeholder="Jogador 1" maxlength="18">
        <input class="input" id="a2" placeholder="Jogador 2" maxlength="18">
      </div>
      <div class="panel stack" style="gap:14px">
        <div class="mono">Dupla 2</div>
        <input class="input" id="b1" placeholder="Jogador 3" maxlength="18">
        <input class="input" id="b2" placeholder="Jogador 4" maxlength="18">
      </div>
      <div class="panel stack" style="gap:14px">
        <div class="mono">Partida</div>
        <div class="field"><label>Torneio</label><input class="input" id="torneio" placeholder="Ex.: Copa Verão" maxlength="26"></div>
        <div class="field"><label>Categoria</label><input class="input" id="cat" placeholder="Ex.: Mista B" maxlength="18"></div>
        <div class="field"><label>Fase</label><input class="input" id="fase" placeholder="Ex.: Quartas de final" maxlength="22"></div>
        <div class="field"><label>Quadra</label><input class="input" id="quadra" placeholder="Ex.: Quadra 2" maxlength="16"></div>
      </div>
      <div class="grid2">
        <div class="field"><label>Games</label><div class="seg" id="segGames"></div></div>
        <div class="field"><label>Tiebreak</label><div class="seg" id="segTb"></div></div>
      </div>
      <div class="field"><label>Sets</label><div class="seg" id="segSets"></div></div>
      <div class="warn" id="setupMsg" style="display:none"></div>
      <button class="btn btn-p btn-full" id="btnStart">Gerar placar e link do OBS</button>
      <button class="btn btn-q btn-full" id="btnDemo">Ver demonstração do overlay</button>
    </div>
  </div>

  <!-- LINK -->
  <div id="linkbox" class="hidden">
    <div class="panel stack" style="gap:14px;margin-bottom:12px">
      <div class="mono">Link do overlay · cole no OBS</div>
      <input class="input" id="ovUrl" readonly style="font-family:var(--fm);font-size:13px">
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn btn-p" style="padding:12px 18px;font-size:15px" id="btnCopy">Copiar link</button>
        <button class="btn btn-q" style="padding:11px 18px;font-size:15px" id="btnOpen">Abrir</button>
      </div>
      <div class="body-sm">No OBS: <b>+ → Navegador</b>, cola a URL, largura <b>1920</b>, altura <b>1080</b>.</div>
    </div>
  </div>

  <!-- MARCADOR -->
  <div id="live" class="hidden">
    <div class="row" style="margin-bottom:12px">
      <div class="mono" id="liveMeta"></div>
      <div class="mono" id="liveState" style="color:var(--orange)"></div>
    </div>
    <div class="stack" style="gap:8px">
      <button class="tap" id="tap1">
        <div class="row"><div style="font-size:19px;font-weight:700" id="lb1">—</div><div class="big" id="lp1">0</div></div>
        <div class="row" style="margin-top:8px"><div class="mono" id="lg1">SETS 0 · GAMES 0</div><div class="mono" id="ls1"></div></div>
      </button>
      <button class="tap" id="tap2">
        <div class="row"><div style="font-size:19px;font-weight:700" id="lb2">—</div><div class="big" id="lp2">0</div></div>
        <div class="row" style="margin-top:8px"><div class="mono" id="lg2">SETS 0 · GAMES 0</div><div class="mono" id="ls2"></div></div>
      </button>
    </div>
    <div class="stack" style="gap:8px;margin-top:14px">
      <div class="grid2">
        <button class="btn btn-q" id="btnUndo">Desfazer</button>
        <button class="btn btn-q" id="btnServe">Trocar saque</button>
      </div>
      <button class="btn btn-q btn-full" id="btnCartela">Mostrar cartela da partida</button>
      <button class="btn btn-q btn-full" id="btnLink">Ver link do OBS</button>
      <button class="btn btn-q btn-full" style="color:var(--danger);border-color:var(--danger)" id="btnEnd">Encerrar partida</button>
    </div>
    <div class="body-sm" style="text-align:center;margin-top:14px" id="syncMsg">—</div>
  </div>
</div>

<script>
// ══════════════════════════════════════════════════════════════
// LEVEL BT · PLACAR DE TRANSMISSÃO
// Um arquivo, dois modos:
//   placar.html                → controle (celular de quem marca)
//   placar.html?overlay=TOKEN  → camada transparente para o OBS
// ══════════════════════════════════════════════════════════════
const SUPA_URL='https://jvmgsedxwakzfpskvfpf.supabase.co';
const SUPA_KEY='sb_publishable_HeNPn65BKSEuJx63GVTiGA_1d3yciE1';
const supa = window.supabase ? window.supabase.createClient(SUPA_URL, SUPA_KEY) : null;

const PTS=['0','15','30','40'];
const $=id=>document.getElementById(id);
const qs=new URLSearchParams(location.search);
const OVERLAY_TOKEN=qs.get('overlay');

// ── Estado da partida ────────────────────────────────────────
function novaPartida(o){
  return {
    t1:o.t1, t2:o.t2, cat:o.cat||'', fase:o.fase||'',
    torneio:o.torneio||'', quadra:o.quadra||'', proxima:'', cartela:'', inicio:Date.now(),
    alvo:o.alvo||6, tbPts:o.tbPts||7, superTb:10, nSets:o.nSets||3, ouro:true,
    p1:0,p2:0,        // pontos do game
    g1:0,g2:0,        // games do set
    s1:0,s2:0,        // sets vencidos
    setsFeitos:[],    // [{g1,g2}]
    inTb:false, tb1:0, tb2:0, superSet:false,
    saque:0,          // 0..3 → índice do jogador
    status:'playing', vencedor:null,
    evento:null,      // selo momentâneo para o overlay
    v:0               // contador de versão (dispara animação)
  };
}
let M=null, ctrlKey=null, tokenPub=null, hist=[];

const nome=(t)=>t.filter(Boolean).join('/');
const precisaSets=m=>m.nSets===3?2:1;

// ── Regras ───────────────────────────────────────────────────
function pontoPara(m,time){
  if(m.status!=='playing') return;
  hist.push(JSON.stringify(m));
  m.evento=null;

  if(m.inTb){
    const alvo = m.superSet ? m.superTb : m.tbPts;
    if(time===1)m.tb1++; else m.tb2++;
    const a=m.tb1,b=m.tb2;
    if((a>=alvo&&a-b>=2)||(b>=alvo&&b-a>=2)){
      const vTb = a>b?1:2;
      if(m.superSet){                       // super tiebreak = o set inteiro
        m.setsFeitos.push({g1:vTb===1?1:0,g2:vTb===2?1:0,tb:[a,b]});
        vTb===1?m.s1++:m.s2++;
        fecharPartidaSePreciso(m);
      } else {
        vTb===1?m.g1++:m.g2++;
        m.setsFeitos.push({g1:m.g1,g2:m.g2,tb:[a,b]});
        vTb===1?m.s1++:m.s2++;
        m.evento={t:'SET',time:vTb};
        novoSet(m);
      }
      m.inTb=false;m.tb1=0;m.tb2=0;
      trocaSaque(m);
    } else if((a+b)%2===1) trocaSaque(m);   // no tiebreak troca a cada 2 pontos
    m.v++; return;
  }

  const meu = time===1?'p1':'p2', dele = time===1?'p2':'p1';
  const sacavaTime = saqueDoTime(m);

  if(m[meu]>=3 && m[dele]>=3){              // 40—40
    if(m.ouro){ ganhaGame(m,time,sacavaTime); m.v++; return; }
    if(m[dele]>3){ m[dele]=3; m.v++; return; }   // tira a vantagem
    if(m[meu]===4){ ganhaGame(m,time,sacavaTime); m.v++; return; }
    m[meu]++; m.v++; return;
  }
  if(m[meu]>=3){ ganhaGame(m,time,sacavaTime); m.v++; return; }
  m[meu]++; m.v++;
}

function ganhaGame(m,time,sacavaTime){
  m.p1=0;m.p2=0;
  time===1?m.g1++:m.g2++;
  if(sacavaTime && sacavaTime!==time) m.evento={t:'QUEBROU',time};
  else m.evento={t:'GAME',time};

  const a=time===1?m.g1:m.g2, b=time===1?m.g2:m.g1;
  if(a>=m.alvo && a-b>=2){
    m.setsFeitos.push({g1:m.g1,g2:m.g2});
    time===1?m.s1++:m.s2++;
    m.evento={t:'SET',time};
    if(!fecharPartidaSePreciso(m)) novoSet(m);
  } else if(m.g1>=m.alvo && m.g2>=m.alvo && m.g1===m.g2){
    m.inTb=true;m.tb1=0;m.tb2=0;
    m.evento={t:'TIEBREAK'};
  }
  trocaSaque(m);
}

function novoSet(m){
  m.g1=0;m.g2=0;m.inTb=false;m.tb1=0;m.tb2=0;
  // terceiro set vira super tiebreak até 10
  if(m.nSets===3 && m.s1===1 && m.s2===1){ m.superSet=true; m.inTb=true; }
}
function fecharPartidaSePreciso(m){
  const need=precisaSets(m);
  if(m.s1>=need||m.s2>=need){
    m.status='finished'; m.vencedor=m.s1>m.s2?1:2;
    m.evento={t:'FIM',time:m.vencedor};
    return true;
  }
  return false;
}
function saqueDoTime(m){ return (m.saque===0||m.saque===1)?1:2; }
function trocaSaque(m){ m.saque=(m.saque+1)%4; }

// ── Momentos de tensão (derivados do placar) ─────────────────
function tensao(m){
  if(m.status!=='playing') return null;
  if(m.inTb){
    const alvo=m.superSet?m.superTb:m.tbPts;
    const a=m.tb1,b=m.tb2;
    if(a>=alvo-1&&a-b>=1) return m.superSet?'MATCH POINT':'SET POINT';
    if(b>=alvo-1&&b-a>=1) return m.superSet?'MATCH POINT':'SET POINT';
    return null;
  }
  const chance=(meu,dele,gMeu,gDele)=>{
    const pontoDeGame = (meu>=3 && meu>dele) || (m.ouro && meu>=3 && dele>=3);
    if(!pontoDeGame) return null;
    const fecharia = gMeu+1>=m.alvo && (gMeu+1)-gDele>=2;
    if(!fecharia) return 'GAME POINT';
    const setsDepois = (gMeu===m.g1?m.s1:m.s2)+1;
    return setsDepois>=precisaSets(m) ? 'MATCH POINT' : 'SET POINT';
  };
  return chance(m.p1,m.p2,m.g1,m.g2) || chance(m.p2,m.p1,m.g2,m.g1);
}

// ── Sincronização ────────────────────────────────────────────
async function publicar(){
  if(!supa||!ctrlKey||!M) return;
  try{
    await supa.rpc('bc_write',{p_control_key:ctrlKey,p_payload:M});
    const el=$('syncMsg'); if(el) el.textContent='Sincronizado · '+new Date().toLocaleTimeString('pt-BR');
  }catch(e){
    const el=$('syncMsg'); if(el) el.textContent='Falha ao sincronizar. Tentando de novo…';
  }
}

// ══════════════ MODO OVERLAY ══════════════
function escalar(){
  const s=Math.min(innerWidth/1920, innerHeight/1080);
  const st=$('stage'); if(st) st.style.transform='scale('+s+')';
}
let ultimoV=-1, ultimoEvento='', tensaoAtual='', brkTimer=null, identTimer=null, identAtual='';

function setsDoTime(m,time){
  // caixas: um quadrado por set já jogado + um "•" para o set em andamento
  const out=[];
  m.setsFeitos.forEach(s=>{
    const meu = time===1?s.g1:s.g2, dele = time===1?s.g2:s.g1;
    const venceu = (s.tb && (meu>dele)) || meu>dele;
    out.push('<span class="'+(venceu?'won':'lost')+'">'+meu+'</span>');
  });
  if(m.status==='playing') out.push('<span>•</span>');
  return out.join('');
}
function linhaSets(m){
  if(!m.setsFeitos.length) return 'SET 1';
  const placar=m.setsFeitos.map(s=>s.g1+'-'+s.g2).join('  ');
  return (m.status==='finished'?'FINAL':'SET '+(m.setsFeitos.length+1))+' · '+placar;
}
function pontoTexto(m,time){
  if(m.inTb) return time===1?m.tb1:m.tb2;
  const v = time===1?m.p1:m.p2;
  return v>3?'AD':PTS[Math.min(v,3)];
}

function pintarOverlay(m){
  if(!m||!m.t1) return;
  const mudou = m.v!==ultimoV;

  $('ovCtx').textContent=[m.cat,m.fase].filter(Boolean).join(' · ').toUpperCase()||'PARTIDA';
  $('ovN1').textContent=nome(m.t1);
  $('ovN2').textContent=nome(m.t2);
  $('ovB1').innerHTML=setsDoTime(m,1);
  $('ovB2').innerHTML=setsDoTime(m,2);
  $('ovSetline').textContent=linhaSets(m);

  const g1=$('ovG1'), g2=$('ovG2');
  if(g1.textContent!==String(m.g1)){ g1.textContent=m.g1; if(mudou) anima(g1,'bump'); }
  if(g2.textContent!==String(m.g2)){ g2.textContent=m.g2; if(mudou) anima(g2,'bump'); }

  const p1=$('ovP1'), p2=$('ovP2');
  const v1=String(pontoTexto(m,1)), v2=String(pontoTexto(m,2));
  if(p1.textContent!==v1){ p1.textContent=v1; if(mudou) anima(p1,'bump'); }
  if(p2.textContent!==v2){ p2.textContent=v2; if(mudou) anima(p2,'bump'); }

  const sq=saqueDoTime(m), jogando=m.status==='playing';
  $('ovR1').classList.toggle('srv',sq===1&&jogando);
  $('ovR2').classList.toggle('srv',sq===2&&jogando);
  $('ovMark').style.top = (sq===2?'calc(50% + 1.5px)':'0');
  $('ovMark').style.display = jogando?'block':'none';

  // — selo de tensão —
  const t=tensao(m);
  if(t!==tensaoAtual){
    tensaoAtual=t;
    const el=$('ovTens');
    if(t){
      $('ovTensBig').innerHTML=t.replace(' ','<br>');
      $('ovTensSub').textContent=(sq===1?nome(m.t1):nome(m.t2)).toUpperCase()+' SACA';
      el.classList.remove('hide'); anima(el,'show');
    } else { el.classList.remove('show'); el.classList.add('hide'); }
  }

  // — quebra de saque (momentâneo) —
  const ev=m.evento?JSON.stringify(m.evento)+'#'+m.v:'';
  if(m.evento && ev!==ultimoEvento){
    ultimoEvento=ev;
    if(m.evento.t==='QUEBROU'){
      const perdeu = m.evento.time===1?m.t2:m.t1;
      $('ovBrkSub').textContent='SAQUE DE '+nome(perdeu).toUpperCase();
      const b=$('ovBrk'); b.classList.remove('hide'); anima(b,'show');
      clearTimeout(brkTimer);
      brkTimer=setTimeout(()=>{ const b=$('ovBrk'); b.classList.remove('show'); b.classList.add('hide'); },4000);
    }
  }

  // — cartela de abertura (acionada pelo controle) —
  const ic=m.cartela||'';
  if(ic!==identAtual){
    identAtual=ic;
    const el=$('ovIdent'), br=$('ovBrandTR');
    if(ic){
      $('idTorn').textContent=(m.torneio||'LEVEL BT').toUpperCase();
      $('idCat').textContent=(m.cat||'—').toUpperCase();
      $('idFase').textContent=(m.fase||'').toUpperCase();
      $('idMeta').innerHTML=[m.quadra,new Date().toLocaleDateString('pt-BR')].filter(Boolean)
        .map(x=>'<span>'+String(x).toUpperCase()+'</span>').join('');
      el.classList.remove('hide'); anima(el,'show'); br.classList.remove('hidden');
      clearTimeout(identTimer);
      identTimer=setTimeout(()=>{ el.classList.remove('show'); el.classList.add('hide');
        setTimeout(()=>br.classList.add('hidden'),400); },9000);
    }
  }

  // — fim de jogo —
  const fim=$('ovFim'), veil=$('ovVeil');
  if(m.status==='finished'){
    const venc=m.vencedor===1?1:2, perd=venc===1?2:1;
    $('fCtx').textContent=[m.torneio,m.cat,m.fase].filter(Boolean).join(' · ').toUpperCase();
    $('fW1').textContent=nome(venc===1?m.t1:m.t2);
    $('fW2').textContent=nome(perd===1?m.t1:m.t2);
    const caixas=(time)=>m.setsFeitos.map(s=>{
      const meu=time===1?s.g1:s.g2, dele=time===1?s.g2:s.g1;
      return '<span class="'+(meu>dele?'w':'')+'">'+meu+'</span>';
    }).join('');
    $('fS1').innerHTML=caixas(venc); $('fS2').innerHTML=caixas(perd);
    const dur=m.inicio?Math.max(1,Math.round((Date.now()-m.inicio)/60000)):null;
    $('fFt').innerHTML=(dur?'<span>DURAÇÃO '+dur+' MIN</span>':'')+
      (m.proxima?'<b>AVANÇA PARA '+String(m.proxima).toUpperCase()+'</b>':'');
    if(!fim.classList.contains('show')){ anima(veil,'show'); anima(fim,'show'); }
    $('bug').classList.add('out');
    $('ovTens').classList.remove('show'); $('ovTens').classList.add('hide');
  } else {
    fim.classList.remove('show'); veil.classList.remove('show');
    fim.style.opacity=''; veil.style.opacity='';
    $('bug').classList.remove('out');
  }
  ultimoV=m.v;
}
function anima(el,cls){ el.classList.remove(cls); void el.offsetWidth; el.classList.add(cls); }

// ── DEMO: partida simulada, para testar o OBS sem banco nem celular ──
function loopDemo(){
  const D=novaPartida({t1:['Marina','Léo'],t2:['Rafa','Duda'],
    cat:'Mista B',fase:'Quartas de final',torneio:'Copa Verão',quadra:'Quadra 2',
    alvo:6,tbPts:7,nSets:3});
  // deixa o jogo perto do fim para ver todos os estados rápido
  D.setsFeitos.push({g1:6,g2:4}); D.s1=1; D.g1=5; D.g2=4;
  let n=0;
  pintarOverlay(D);
  setTimeout(()=>{ D.cartela='ident#demo'; D.v++; pintarOverlay(D); }, 1500);
  setTimeout(()=>{ D.cartela=''; D.v++; pintarOverlay(D); }, 10500);
  const tick=()=>{
    if(D.status==='finished'){
      setTimeout(()=>location.reload(), 7000); return;   // recomeça o ciclo
    }
    // alterna os pontos com uma pitada de aleatório
    const quem = (n<3) ? 1 : (Math.random()<0.55?1:2);
    pontoPara(D,quem); n++;
    pintarOverlay(D);
    setTimeout(tick, 2200);
  };
  setTimeout(tick, 11500);
}

async function loopOverlay(){
  try{
    const {data}=await supa.rpc('bc_read',{p_token:OVERLAY_TOKEN});
    if(data && data.t1) pintarOverlay(data);
  }catch(e){}
  setTimeout(loopOverlay,900);
}

// ══════════════ MODO CONTROLE ══════════════
let cfg={alvo:6,tbPts:7,nSets:3};
function segs(){
  const mk=(el,vals,key,suf)=>{
    el.innerHTML=vals.map(v=>`<button data-v="${v}" class="${cfg[key]===v?'on':''}">${v}${suf||''}</button>`).join('');
    el.querySelectorAll('button').forEach(b=>b.onclick=()=>{cfg[key]=Number(b.dataset.v);segs();});
  };
  mk($('segGames'),[4,6],'alvo');
  mk($('segTb'),[7,10],'tbPts');
  mk($('segSets'),[1,3],'nSets');
}

function pintarControle(){
  const m=M;
  $('liveMeta').textContent=[m.cat,m.fase].filter(Boolean).join(' · ').toUpperCase()||'PARTIDA';
  const t=tensao(m);
  $('liveState').textContent = m.status==='finished' ? 'ENCERRADA'
    : m.inTb ? (m.superSet?'SUPER TIEBREAK':'TIEBREAK') : (t||'');
  $('lb1').textContent=nome(m.t1); $('lb2').textContent=nome(m.t2);
  $('lp1').textContent=m.inTb?m.tb1:(m.p1>3?'AD':PTS[Math.min(m.p1,3)]);
  $('lp2').textContent=m.inTb?m.tb2:(m.p2>3?'AD':PTS[Math.min(m.p2,3)]);
  $('lg1').textContent='SETS '+m.s1+' · GAMES '+m.g1;
  $('lg2').textContent='SETS '+m.s2+' · GAMES '+m.g2;
  const sq=saqueDoTime(m);
  $('ls1').textContent=sq===1&&m.status==='playing'?'SACANDO':'';
  $('ls2').textContent=sq===2&&m.status==='playing'?'SACANDO':'';
  $('tap1').classList.toggle('lead',sq===1&&m.status==='playing');
  $('tap2').classList.toggle('lead',sq===2&&m.status==='playing');
  $('btnUndo').disabled=!hist.length;
}

async function iniciar(){
  const t1=[$('a1').value.trim(),$('a2').value.trim()].filter(Boolean);
  const t2=[$('b1').value.trim(),$('b2').value.trim()].filter(Boolean);
  if(t1.length<1||t2.length<1){ aviso('Preenche pelo menos um nome de cada dupla.'); return; }
  const btn=$('btnStart'); btn.disabled=true; btn.textContent='Criando…';
  try{
    const {data,error}=await supa.rpc('bc_create');
    const r=Array.isArray(data)?data[0]:data;
    if(error||!r) throw new Error('rpc');
    tokenPub=r.token; ctrlKey=r.control_key;
    localStorage.setItem('lbt_bc',JSON.stringify({token:tokenPub,key:ctrlKey}));
  }catch(e){
    aviso('Não consegui criar a transmissão. Confere se o SQL foi rodado no Supabase.');
    btn.disabled=false; btn.textContent='Gerar placar e link do OBS'; return;
  }
  M=novaPartida({t1,t2,cat:$('cat').value.trim(),fase:$('fase').value.trim(),
                 torneio:$('torneio').value.trim(),quadra:$('quadra').value.trim(),
                 alvo:cfg.alvo,tbPts:cfg.tbPts,nSets:cfg.nSets});
  hist=[];
  const url=location.origin+location.pathname+'?overlay='+tokenPub;
  $('ovUrl').value=url;
  $('setup').classList.add('hidden');
  $('linkbox').classList.remove('hidden');
  $('live').classList.remove('hidden');
  pintarControle(); publicar();
}
function aviso(t){ const e=$('setupMsg'); e.textContent=t; e.style.display='block'; }

function ligarControle(){
  segs();
  $('btnStart').onclick=iniciar;
  $('btnDemo').onclick=()=>window.open(location.origin+location.pathname+'?overlay=demo','_blank');
  $('tap1').onclick=()=>{pontoPara(M,1);pintarControle();publicar();};
  $('tap2').onclick=()=>{pontoPara(M,2);pintarControle();publicar();};
  $('btnUndo').onclick=()=>{ if(!hist.length)return; M=JSON.parse(hist.pop()); M.v++; pintarControle(); publicar(); };
  $('btnServe').onclick=()=>{ trocaSaque(M); M.v++; pintarControle(); publicar(); };
  $('btnLink').onclick=()=>$('linkbox').classList.toggle('hidden');
  $('btnCartela').onclick=()=>{ M.cartela='ident#'+Date.now(); M.v++; publicar();
    $('btnCartela').textContent='Cartela no ar…';
    setTimeout(()=>{ M.cartela=''; publicar(); $('btnCartela').textContent='Mostrar cartela da partida'; },9000); };
  $('btnEnd').onclick=()=>{ if(!confirm('Encerrar a partida?'))return; hist.push(JSON.stringify(M));
    M.status='finished'; M.vencedor=(M.s1>M.s2)?1:(M.s2>M.s1?2:(M.g1>=M.g2?1:2));
    M.evento={t:'FIM',time:M.vencedor}; M.v++; pintarControle(); publicar(); };
  $('btnCopy').onclick=async()=>{ try{ await navigator.clipboard.writeText($('ovUrl').value);
      $('btnCopy').textContent='Copiado'; setTimeout(()=>$('btnCopy').textContent='Copiar link',1600);
    }catch(e){ $('ovUrl').select(); } };
  $('btnOpen').onclick=()=>window.open($('ovUrl').value,'_blank');
}

// ══════════════ BOOT ══════════════
if(OVERLAY_TOKEN){
  document.body.classList.add('ov');
  $('stage').classList.remove('hidden');
  escalar(); addEventListener('resize',escalar);
  if(OVERLAY_TOKEN==='demo') loopDemo(); else loopOverlay();
}else{
  $('ctrl').classList.remove('hidden');
  ligarControle();
}
</script>
