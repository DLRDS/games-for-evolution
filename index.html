<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0D0D0D">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Level BT">
  <title>Level BT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=Archivo+Black&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    /* ══════════════════════════════════════════════════════════════
       LEVEL BT — design system
       Fonte da verdade: manual da marca + telas do Claude Design.
       Corpo 16/14 · Rótulo mono 11 · Título 24/700 · Display 48/-3.5%
       Raios: 999 botões/chips · 16 linha · 20 card · 24 painel
       ══════════════════════════════════════════════════════════════ */
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    :root{
      --orange:#FF6600;      /* marca · placar · ação · o que evolui */
      --orange-ink:#B83E00;  /* laranja de texto pequeno sobre claro */
      --ink:#0D0D0D;         /* fundo escuro / tinta sobre laranja */
      --surf:#1A1A1A;        /* superfície (cards) */
      --line:#2A2A2A;        /* borda e segmento apagado */
      --label:#A8A8A8;       /* rótulo no escuro */
      --dim:#6B6B6B;         /* rótulo terciário */
      --white:#FFFFFF;
      --danger:#FF4D4D; --ok:#22c55e;
      --fd:'Archivo Black',sans-serif;   /* display, placar, números, ELO */
      --fb:'Archivo',sans-serif;         /* corpo e títulos */
      --fm:'JetBrains Mono',monospace;   /* rótulo, metadado, nível */
      --nav-h:76px;
      --safe-top:env(safe-area-inset-top, 0px);
    }
    html,body{height:100%;}
    body{background:var(--ink);color:var(--white);font-family:var(--fb);font-size:16px;line-height:1.5;
      -webkit-font-smoothing:antialiased;overflow-x:hidden;}
    button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;}
    button{background:none;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;}

    /* ── TIPOGRAFIA ───────────────────────────────────────────── */
    .display{font-family:var(--fd);font-size:34px;line-height:1.05;letter-spacing:-.035em;color:var(--white);}
    .display-lg{font-family:var(--fd);font-size:48px;line-height:1;letter-spacing:-.035em;color:var(--white);}
    .h1{font-family:var(--fd);font-size:28px;letter-spacing:-.03em;line-height:1.1;color:var(--white);}
    .h2{font-family:var(--fb);font-size:24px;font-weight:700;line-height:1.2;color:var(--white);}
    .h3{font-size:18px;font-weight:700;color:var(--white);}
    .body{font-size:16px;color:var(--white);}
    .body-sm{font-size:14px;color:var(--label);}
    .muted{color:var(--label);}
    .num{font-family:var(--fd);letter-spacing:-.03em;color:var(--white);}
    /* traço de placar: escala com o número e não domina a linha */
    .dash{display:inline-block;width:.42em;height:.09em;background:currentColor;
      vertical-align:.24em;margin:0 .13em;border-radius:99px;}
    .mono{font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--label);}
    #hd-sub{font-weight:700;color:var(--white);}
    .mono-md{font-family:var(--fm);font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--label);}
    .accent{color:var(--orange);}

    /* ── ESTRUTURA ────────────────────────────────────────────── */
    #app{min-height:100dvh;display:flex;flex-direction:column;max-width:480px;margin:0 auto;position:relative;padding-top:var(--safe-top);}
    .topbar{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 0;gap:10px;}
    .screen{flex:1;padding:20px 20px calc(var(--nav-h) + 24px);overflow-y:auto;}
    .stack{display:flex;flex-direction:column;gap:12px;}
    .stack-sm{display:flex;flex-direction:column;gap:8px;}
    .row{display:flex;align-items:center;justify-content:space-between;gap:10px;}
    .sep{height:1px;background:var(--line);}
    .vsep{width:1px;background:var(--line);align-self:stretch;}

    /* ── MARCA ────────────────────────────────────────────────── */
    .lock{display:flex;align-items:center;gap:9px;}
    .lock-word{font-family:var(--fd);font-size:19px;letter-spacing:-.03em;color:var(--white);}
    .lock-word b{color:var(--orange);font-weight:inherit;}
    .meter{display:flex;align-items:flex-end;gap:3px;height:20px;}
    .meter i{width:5px;border-radius:999px;background:var(--line);display:block;}
    .meter i.on{background:var(--orange);}

    /* medidor horizontal de nível (5 segmentos, largura cheia) */
    .lvbar{display:flex;gap:5px;}
    .lvbar i{height:14px;border-radius:999px;flex:1;background:var(--line);}
    .lvbar i.on{background:var(--orange);}
    /* cápsulas compactas (linhas de ranking) */
    .lvcaps{display:flex;gap:4px;}
    .lvcaps i{width:15px;height:7px;border-radius:999px;background:var(--line);}
    .lvcaps i.on{background:var(--orange);}

    /* ── CARTÕES ──────────────────────────────────────────────── */
    .card{background:var(--surf);border-radius:20px;padding:16px;}
    .panel{background:var(--surf);border-radius:24px;padding:20px;}
    .line-item{background:var(--surf);border-radius:16px;padding:16px;}
    .card-o{border:1.5px solid var(--orange);}

    /* ── BOTÕES ───────────────────────────────────────────────── */
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;
      padding:16px 22px;font-size:16px;font-weight:700;transition:transform .1s,opacity .15s;}
    .btn:active{transform:scale(.97);}
    .btn:disabled{opacity:.4;cursor:not-allowed;}
    .btn-p{background:var(--orange);color:var(--ink);}
    .btn-o{border:1.75px solid var(--white);color:var(--white);font-weight:600;padding:14px 20px;}
    .btn-q{border:1.75px solid var(--line);color:var(--white);font-weight:600;padding:14px 20px;}
    .btn-d{background:var(--danger);color:var(--white);}
    .btn-sm{padding:10px 16px;font-size:15px;}
    .btn-full{width:100%;}
    .btn-link{color:var(--label);font-size:14px;font-weight:400;padding:4px;}

    /* ── CHIPS / PÍLULAS / ABAS ───────────────────────────────── */
    .pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px;
      font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.14em;}
    .pill-live{background:var(--orange);color:var(--ink);}
    .pill-live .dot{width:7px;height:7px;border-radius:999px;background:var(--ink);animation:blink 1.2s infinite;}
    .pill-o{border:1.5px solid var(--orange);color:var(--orange);}
    .pill-w{background:var(--white);color:var(--ink);}
    .pill-g{border:1.5px solid var(--line);color:var(--label);font-weight:400;}
    @keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

    .tabs{display:flex;gap:8px;flex-wrap:wrap;}
    .tab{border:1.5px solid var(--line);color:var(--label);border-radius:999px;padding:7px 16px;
      font-family:var(--fm);font-size:12px;font-weight:700;letter-spacing:.12em;background:transparent;}
    .tab.on{background:var(--white);color:var(--ink);font-weight:700;border-color:var(--white);}

    /* seletor segmentado (Entrar / Criar conta) */
    .seg{display:flex;background:var(--surf);border-radius:999px;padding:5px;gap:6px;}
    .seg button{flex:1;border-radius:999px;padding:10px;font-size:15px;font-weight:500;color:var(--label);}
    .seg button.on{background:var(--white);color:var(--ink);font-weight:700;}

    /* ── CAMPOS ───────────────────────────────────────────────── */
    .field{display:flex;flex-direction:column;gap:8px;}
    .field > label{font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--label);}
    .input{background:var(--surf);border:1.5px solid var(--line);border-radius:16px;padding:15px 16px;
      font-size:16px;color:var(--white);width:100%;outline:none;transition:border-color .15s;}
    .input::placeholder{color:var(--dim);}
    .input:focus{border-color:var(--orange);}
    .input.err{border-color:var(--danger);}
    .field-err{font-size:14px;color:var(--orange);display:flex;align-items:center;gap:7px;}
    .code-input{background:var(--ink);border:1.5px solid var(--line);border-radius:16px;padding:14px 16px;
      font-family:var(--fm);font-size:18px;letter-spacing:.24em;color:var(--white);width:100%;outline:none;text-transform:uppercase;}
    .code-input:focus{border-color:var(--orange);}

    /* divisor com rótulo (OU) */
    .or{display:flex;align-items:center;gap:14px;}
    .or .sep{flex:1;}
    .or span{font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.2em;color:var(--dim);}

    /* ── BARRA DE 4 ABAS ──────────────────────────────────────── */
    nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
      background:var(--ink);border-top:1px solid var(--line);display:flex;justify-content:space-between;
      padding:12px 16px calc(22px + env(safe-area-inset-bottom));z-index:200;}
    .nb{display:flex;align-items:center;gap:6px;color:var(--label);font-size:14px;padding:4px 6px;}
    .nb.on{color:var(--orange);font-weight:700;}
    .nb svg{flex-shrink:0;}

    /* ── PROGRESSO (saque) ────────────────────────────────────── */
    .prog{height:8px;border-radius:999px;background:var(--line);overflow:hidden;}
    .prog i{display:block;height:100%;border-radius:999px;background:var(--orange);}

    /* ── OVERLAYS / MODAIS ────────────────────────────────────── */
    .overlay{position:fixed;inset:0;background:var(--ink);z-index:400;display:flex;flex-direction:column;padding-top:var(--safe-top);
      max-width:480px;margin:0 auto;overflow-y:auto;}
    .overlay.hidden,.hidden{display:none !important;}
    .sheet-ov{position:fixed;inset:0;background:rgba(0,0,0,.8);z-index:500;display:flex;align-items:flex-end;justify-content:center;}
    .sheet{background:var(--surf);border-radius:24px 24px 0 0;padding:24px 20px calc(24px + env(safe-area-inset-bottom));
      width:100%;max-width:480px;max-height:88dvh;overflow-y:auto;}
    .toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 20px);z-index:700;
      background:var(--white);color:var(--ink);border-radius:999px;padding:12px 20px;font-size:15px;font-weight:600;
      display:flex;align-items:center;gap:8px;box-shadow:0 8px 30px rgba(0,0,0,.5);}

    /* ── ESTADO VAZIO ─────────────────────────────────────────── */
    .empty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:48px 20px;text-align:center;}
    .empty-ico{color:var(--line);}
    .empty h3{font-size:18px;font-weight:700;color:var(--white);}
    .empty p{font-size:15px;color:var(--label);max-width:280px;}

    /* ── UTILITÁRIOS ──────────────────────────────────────────── */
    .grow{flex:1;min-width:0;}
    .trunc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .center{text-align:center;}
    .right{text-align:right;}
    .wrap-x{overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;}
    .wrap-x::-webkit-scrollbar{display:none;}
  </style>
</head>
<body>
<!-- ══ APP SHELL ══ -->
<div id="app">
  <div class="topbar" id="topbar">
    <div class="lock">
      <div class="meter" aria-hidden="true"><i class="on" style="height:9px"></i><i class="on" style="height:13px"></i><i class="on" style="height:17px"></i><i style="height:20px"></i></div>
      <div class="lock-word">LEVEL<b>BT</b></div>
    </div>
    <div id="topbar-right"><span class="mono" id="hd-sub"></span></div>
  </div>
  <main class="screen" id="content"></main>
  <nav>
    <button class="nb on" id="nav-home" onclick="nav('home')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9v12h14V9"/></svg><span>Home</span></button>
    <button class="nb" id="nav-sessoes" onclick="nav('sessoes')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M8 2v4"/><path d="M16 2v4"/><path d="M3 10h18"/></svg><span>Sessões</span></button>
    <button class="nb" id="nav-ranking" onclick="nav('ranking')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7"/><path d="M12 21V8"/><path d="M20 21v-11"/></svg><span>Ranking</span></button>
    <button class="nb" id="nav-perfil" onclick="nav('perfil')">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Perfil</span></button>
  </nav>
</div>

<!-- pílula AO VIVO flutuante (aparece quando há partida rolando) -->
<div id="live-badge" class="pill pill-live" onclick="goToLive()" style="display:none;position:fixed;top:calc(env(safe-area-inset-top, 0px) + 16px);right:20px;z-index:300;cursor:pointer"><span class="dot"></span>AO VIVO</div>

<!-- ══ PLACAR AO VIVO ══ -->
<div id="live-overlay" class="overlay hidden"><div id="live-inner" style="display:flex;flex-direction:column;min-height:calc(100dvh - env(safe-area-inset-top, 0px));position:relative"></div></div>

<!-- ══ SPLASH ══ -->
<div id="gfe-splash" class="overlay hidden" style="align-items:center;justify-content:center;gap:14px">
  <div class="meter" style="gap:7px;height:auto" aria-hidden="true"><i class="on" style="width:11px;height:26px"></i><i class="on" style="width:11px;height:38px"></i><i class="on" style="width:11px;height:50px"></i><i class="on" style="width:11px;height:62px"></i><i style="width:11px;height:74px"></i></div>
  <div style="display:flex;align-items:center;gap:10px">
    <span class="display-lg" style="font-size:56px">LEVEL</span>
    <span style="font-family:var(--fd);font-size:40px;background:var(--orange);color:var(--ink);border-radius:999px;padding:2px 14px;line-height:1.1">BT</span>
  </div>
  <div class="body-sm">Todo jogo te move no ranking.</div>
</div>

<!-- ══ LOGIN / CADASTRO ══ -->
<div id="gfe-login" class="overlay hidden"><div id="login-body" style="padding:28px 20px 40px"></div></div>


<!-- ══ ONBOARDING ══ -->
<div id="gfe-onboarding" class="overlay hidden">
  <div class="grow" style="display:flex;overflow:hidden" id="ob-slides"></div>
  <div style="padding:20px 20px 40px;display:flex;flex-direction:column;align-items:center;gap:18px">
    <div style="display:flex;gap:8px" id="ob-dots"></div>
    <button class="btn btn-p btn-full" id="ob-btn" onclick="obNext()">Continuar</button>
  </div>
</div>

<!-- ══ SELETOR DE JOGADOR ══ -->
<div id="player-selector" class="overlay hidden" style="padding:28px 20px">
  <div class="h1" style="margin-bottom:6px">QUEM É VOCÊ?</div>
  <div class="body-sm" style="margin-bottom:20px">Escolhe teu perfil no grupo.</div>
  <div class="stack-sm" id="ps-grid"></div>
</div>

<!-- ══ MODAIS (folhas) ══ -->
<div class="sheet-ov modal-ov hidden" id="modal-new-session"><div class="sheet">
  <div class="h2" style="margin-bottom:16px">Nova sessão</div>
  <div class="stack">
    <div class="field"><label>Nome (opcional)</label><input class="input" type="text" id="ns-name" maxlength="40" placeholder="Ex.: Quarta do Parque"></div>
    <div class="field"><label>Data</label><input class="input" type="date" id="ns-date"></div>
    <div style="display:flex;gap:8px;margin-top:6px"><button class="btn btn-q grow" onclick="closeModal('modal-new-session')">Cancelar</button><button class="btn btn-p grow" onclick="createSession()">Criar</button></div>
  </div>
</div></div>

<div class="sheet-ov modal-ov hidden" id="modal-confirm"><div class="sheet">
  <div class="h2" style="margin-bottom:6px">Confirmar presença</div>
  <div class="body-sm" style="margin-bottom:16px">Escolhe quem entra na lista.</div>
  <div class="tabs" id="confirm-chips" style="margin-bottom:16px"></div>
  <div class="field"><label>Ou digita um nome</label><input class="input" type="text" id="confirm-input" maxlength="30" placeholder="Nome do jogador"></div>
  <div style="display:flex;gap:8px;margin-top:16px"><button class="btn btn-q grow" onclick="closeModal('modal-confirm')">Cancelar</button><button class="btn btn-p grow" onclick="confirmPresenca()">Confirmar</button></div>
</div></div>

<div class="sheet-ov modal-ov hidden" id="modal-profile"><div class="sheet" id="modal-profile-content"></div></div>
<div class="sheet-ov modal-ov hidden" id="modal-manage-player"><div class="sheet" id="modal-manage-content"></div></div>

<div class="sheet-ov modal-ov hidden" id="modal-add-player"><div class="sheet">
  <div class="h2" style="margin-bottom:16px">Adicionar jogador</div>
  <div class="field"><label>Nome</label><input class="input" type="text" id="add-player-name" maxlength="30" placeholder="Nome do jogador"></div>
  <div style="display:flex;gap:8px;margin-top:16px"><button class="btn btn-q grow" onclick="closeModal('modal-add-player')">Cancelar</button><button class="btn btn-p grow" onclick="confirmAddPlayer()">Adicionar</button></div>
</div></div>

<div class="sheet-ov modal-ov hidden" id="modal-manual-game"><div class="sheet">
  <div class="h2" style="margin-bottom:6px">Registrar jogo de fora</div>
  <div class="body-sm" style="margin-bottom:16px">Jogos fora do app entram só na tua evolução — não mexem no ranking do grupo.</div>
  <div class="stack">
    <div class="field"><label>Você</label><input class="input" type="text" id="mg-my" placeholder="Seu nome" maxlength="30"></div>
    <div class="field"><label>Sua dupla</label><input class="input" type="text" id="mg-mypair" placeholder="Parceiro(a)" maxlength="30"></div>
    <div class="field"><label>Adversário 1</label><input class="input" type="text" id="mg-opp" placeholder="Nome" maxlength="30"></div>
    <div class="field"><label>Adversário 2</label><input class="input" type="text" id="mg-opppair" placeholder="Nome" maxlength="30"></div>
    <div class="field"><label>Data</label><input class="input" type="date" id="mg-date"></div>
    <div id="mg-format"></div>
    <div class="field"><label id="mg-score-label">Placar</label><div style="display:flex;align-items:center;gap:10px">
      <input class="input" type="number" id="mg-note" min="0" max="99" placeholder="0" style="text-align:center">
      <span class="mono">×</span>
      <input class="input" type="number" id="mg-opp-score" min="0" max="99" placeholder="0" style="text-align:center">
    </div></div>
    <div id="mg-msg" class="field-err" style="display:none"></div>
    <div style="display:flex;gap:8px;margin-top:6px"><button class="btn btn-q grow" onclick="closeModal('modal-manual-game')">Cancelar</button><button class="btn btn-p grow" onclick="saveManualGame()">Salvar</button></div>
  </div>
</div></div>

<!-- ══ TOAST ══ -->
<div id="toast" class="toast hidden"></div>

<script>
// ══════════════════════════════════════
// DATA
// ══════════════════════════════════════
const DB = {
  _g(k,d){ try{return JSON.parse(localStorage.getItem('gfe6_'+k))??d;}catch{return d;} },
  _s(k,v){ localStorage.setItem('gfe6_'+k,JSON.stringify(v)); },
  players()    { return this._g('players',[]); },
  setPlayers(v){ this._s('players',v); },
  sessions()   { return this._g('sessions',[]); },
  setSessions(v){ this._s('sessions',v); },
  matches()    { return this._g('matches',[]); },
  setMatches(v){ this._s('matches',v); },
  tourns()     { return this._g('tourns',[]); },
  setTourns(v) { this._s('tourns',v); },
  pwd()        { return this._g('pwd','1234'); },
  setPwd(v)    { this._s('pwd',v); },
  adminOn()         { return sessionStorage.getItem('gfe_adm')==='1'; },
  setAdmin(v)       { v?sessionStorage.setItem('gfe_adm','1'):sessionStorage.removeItem('gfe_adm'); },
  currentPlayer()   { return this._g('currentPlayer', null); },
  setCurrentPlayer(v){ this._s('currentPlayer', v); },
  onboardingDone()  { return this._g('onboardingDone', false); },
  setOnboardingDone(){ this._s('onboardingDone', true); },
  groupName()       { return this._g('groupName', null); },
  setGroupName(v)   { this._s('groupName', v); },
  authUserId()      { return this._g('authUserId', null); },
  setAuthUserId(v)  { this._s('authUserId', v); },
  myName()          { return this._g('myName', null); },
  setMyName(v)      { this._s('myName', v); },
  activeGroup()     { return this._g('activeGroup', null); },
  setActiveGroup(v) { this._s('activeGroup', v); },
  groupNames()      { return this._g('groupNames', {}); },
  setGroupNames(v)  { this._s('groupNames', v); },
  challenges()      { return this._g('challenges', []); },
  setChallenges(v)  { this._s('challenges', v); },
  manualGames()     { return this._g('manualGames', []); },
  setManualGames(v) { this._s('manualGames', v); },
};

// ── PROTEÇÃO DE PIN ──
// Em vez de guardar o PIN em texto puro (que qualquer um conseguiria ler no banco),
// guardamos uma "impressão digital" embaralhada (hash). Não dá para voltar do hash ao PIN.
async function hashPin(pin){
  try{
    const data=new TextEncoder().encode('gfe_pin_v1::'+pin);
    const buf=await crypto.subtle.digest('SHA-256',data);
    return 'h$'+Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,'0')).join('');
  }catch(e){ return 'h$'+pin; } // fallback raríssimo (navegador muito antigo / sem https)
}
// Confere se o PIN digitado bate com o guardado. Aceita PINs antigos em texto puro
// (de antes desta atualização) para ninguém ficar travado fora da conta.
async function pinMatches(stored, raw){
  if(stored==null||stored==='') return null; // ainda não tem PIN definido
  if(String(stored).startsWith('h$')) return stored===await hashPin(raw);
  return String(stored)===String(raw); // PIN antigo em texto puro
}

async function syncFromSupabase(){
  if(!supa)return;
  const [{data:players},{data:sessions},{data:matches}]=await Promise.all([
    supa.from('players').select('*'),
    supa.from('sessions').select('*').order('date',{ascending:false}),
    supa.from('matches').select('*').order('date',{ascending:true}),
  ]);
  if(players&&players.length) DB._s('players',players);
  if(sessions&&sessions.length) DB._s('sessions',sessions.map(sessionFromDB));
  if(matches&&matches.length) DB._s('matches',matches.map(matchFromDB));
  // Desafios em separado: se a tabela ainda não existir, não quebra o resto
  try{ const {data:challenges}=await supa.from('challenges').select('*'); if(challenges) DB._s('challenges',challenges); }catch(e){}
}

let _pollTimer=null;

async function initSupabase(){
  try{
    supa=supabase.createClient(SUPA_URL,SUPA_KEY);
    await syncFromSupabase();
    // Intercepta escritas do DB para também salvar no Supabase
    const _sp=DB.setPlayers.bind(DB);
    DB.setPlayers=v=>{ _sp(v);
      // envia só as linhas que este usuário pode gravar (as próprias + as do(s) seu(s) grupo(s)),
      // pra uma linha órfã não fazer o banco rejeitar o lote inteiro (o que barrava jogadores avulsos)
      const me=DB.authUserId();
      const myGroups=new Set(v.filter(p=>p.user_id===me).map(p=>p.group_id));
      const writable=v.filter(p=>p.user_id===me||myGroups.has(p.group_id));
      supa.from('players').upsert(writable).then(({error})=>{ if(error)console.warn('supa players:',error); });
    };
    const _ss=DB.setSessions.bind(DB);
    DB.setSessions=v=>{ _ss(v); supa.from('sessions').upsert(v.map(sessionToDB)).then(({error})=>{ if(error)console.warn('supa sessions:',error); }); };
    const _sm=DB.setMatches.bind(DB);
    DB.setMatches=v=>{ _sm(v); supa.from('matches').upsert(v.map(matchToDB)).then(({error})=>{ if(error)console.warn('supa matches:',error); }); };
    const _sc=DB.setChallenges.bind(DB);
    DB.setChallenges=v=>{ _sc(v); supa.from('challenges').upsert(v).then(({error})=>{ if(error)console.warn('supa challenges:',error); }); };
    // Polling: sincroniza com o banco a cada 3s (garante atualização entre dispositivos)
    startPolling();
    document.addEventListener('visibilitychange',()=>{
      document.hidden ? stopPolling() : startPolling();
    });
  } catch(e){ console.warn('Supabase init error:',e); }
}

function startPolling(){
  if(_pollTimer)return;
  _pollTimer=setInterval(async()=>{
    if(document.hidden||!supa)return;
    const prev=JSON.stringify({s:DB.sessions(),m:DB.matches().length,p:DB.players(),c:DB.challenges()});
    await syncFromSupabase();
    const next=JSON.stringify({s:DB.sessions(),m:DB.matches().length,p:DB.players(),c:DB.challenges()});
    if(prev!==next){
      recalcAllElo();
      // Auto-navegar para sessão ao vivo se espectador
      _checkLiveSession();
      render();
    }
    // Sempre atualiza badge ao vivo no header
    _updateLiveBadge();
  },3000);
}

function _checkLiveSession(){
  if(sessionFlow) return; // é o organizador, não faz nada
  const pid=DB.currentPlayer();
  if(!pid) return;
  const activeSess=groupSessions().find(s=>
    s.status==='active' &&
    (s.liveScore||s.flowState) &&
    (s.confirmed||[]).includes(pid)
  );
  if(!activeSess) return;
  // Abre automaticamente a sessão ao vivo
  if(page!=='sessoes'){ listaActiveId=activeSess.id; nav('sessoes'); return; }
  listaActiveId=activeSess.id;
}

function _updateLiveBadge(){
  const pid=DB.currentPlayer();
  const activeSess=groupSessions().find(s=>s.status==='active'&&(s.liveScore||s.flowState));
  const badge=document.getElementById('live-badge');
  if(!badge) return;
  if(activeSess){ badge.style.display='flex'; }
  else { badge.style.display='none'; }
}

function stopPolling(){
  if(_pollTimer){ clearInterval(_pollTimer); _pollTimer=null; }
}

async function joinGroup(code){
  const c=(code||'').trim().toUpperCase();
  if(!c){ groupSetupError('Digite o código do grupo.'); return; }
  pendingInvite=null; clearInviteUrl();
  // já sou membro deste grupo? só troca pra ele
  const already=myPlayerRows().find(p=>p.group_id===c);
  if(already){ setActiveGroup(c); enterAppAfterGroup(); return; }
  const btn=document.getElementById('gs-btn'); if(btn){ btn.disabled=true; btn.textContent='Entrando…'; }
  const {data,error}=await supa.rpc('group_info',{p_code:c});
  const grp=Array.isArray(data)?data[0]:data;
  if(error||!grp){ groupSetupError('Grupo não encontrado. Confira o código.'); if(btn){ btn.disabled=false; btn.innerHTML=icon('arrowRight',18)+' Entrar'; } return; }
  // cria meu perfil de jogador NESTE grupo (membro)
  const players=DB.players(); const newId=uid();
  players.push({id:newId,name:DB.myName()||'Jogador',elo:1000,role:null,user_id:DB.authUserId(),group_id:grp.gid});
  DB.setPlayers(players);
  const names=DB.groupNames()||{}; names[grp.gid]=grp.gname; DB.setGroupNames(names);
  DB.setCurrentPlayer(newId); DB.setActiveGroup(grp.gid); DB.setGroupName(grp.gname);

}

function validEmail(e){ return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(e); }
function traduzErroAuth(m){
  m=String(m||'');
  if(/invalid login credentials/i.test(m)) return 'Email ou senha incorretos.';
  if(/already registered|already exists|user already/i.test(m)) return 'Esse email já tem conta. Toque em "Entrar".';
  if(/password should be at least|at least 6/i.test(m)) return 'A senha precisa ter ao menos 6 caracteres.';
  if(/unable to validate email|invalid email/i.test(m)) return 'Email inválido.';
  if(/email not confirmed/i.test(m)) return 'Email ainda não confirmado.';
  return 'Algo deu errado. Tente de novo.';
}

async function doLogin(){
  if(authBusy)return;
  authError('');
  const email=(document.getElementById('auth-email')?.value||'').trim().toLowerCase();
  const pass=document.getElementById('auth-pass')?.value||'';
  if(!email||!pass){ authError('Preencha email e senha.'); return; }
  setAuthBusy(true);
  const {data,error}=await supa.auth.signInWithPassword({email,password:pass});
  if(error){ setAuthBusy(false); authError(traduzErroAuth(error.message)); return; }
  await ensureProfile(data.user);
  setAuthBusy(false);
  finishAuth();
}

async function doSignup(){
  if(authBusy)return;
  authError('');
  const name=cleanName(document.getElementById('auth-name')?.value||'');
  const email=(document.getElementById('auth-email')?.value||'').trim().toLowerCase();
  const pass=document.getElementById('auth-pass')?.value||'';
  if(!name){ authError('Digite seu nome.'); return; }
  if(!validEmail(email)){ authError('Digite um email válido.'); return; }
  if(pass.length<6){ authError('A senha precisa ter ao menos 6 caracteres.'); return; }
  setAuthBusy(true);
  const {data,error}=await supa.auth.signUp({email,password:pass,options:{data:{name}}});
  if(error){ setAuthBusy(false); authError(traduzErroAuth(error.message)); return; }
  let user=data.user;
  // Com "Confirmar email" desligado, o cadastro já volta logado. Caso não, faz login.
  if(!data.session){
    const {data:d2,error:e2}=await supa.auth.signInWithPassword({email,password:pass});
    if(e2){ setAuthBusy(false); authError('Conta criada! Agora toque em "Entrar".'); loginMode='login'; renderLogin(); return; }
    user=d2.user;
  }
  await ensureProfile(user);
  setAuthBusy(false);
  finishAuth();
}

// ══════════════════════════════════════
// ELO ENGINE
// ══════════════════════════════════════
const ELO_K=32;
function expectedScore(a,b){ return 1/(1+Math.pow(10,(b-a)/400)); }

// Simulação de ranking: quanto cada time ganha/perde de ELO conforme o resultado
function eloStakes(team1,team2){
  const t1=team1.filter(Boolean), t2=team2.filter(Boolean);
  if(!t1.length||!t2.length) return null;
  const avgA=t1.reduce((s,id)=>s+getElo(id),0)/t1.length;
  const avgB=t2.reduce((s,id)=>s+getElo(id),0)/t2.length;
  const expA=expectedScore(avgA,avgB);
  return {
    t1Win:Math.round(ELO_K*(1-expA)),  t1Lose:-Math.round(ELO_K*expA),
    t2Win:Math.round(ELO_K*expA),      t2Lose:-Math.round(ELO_K*(1-expA)),
  };
}

function recalcAllElo(){
  // reset all players to 1000, replay all matches in order
  let players=DB.players();
  players.forEach(p=>{ p.elo=1000; });
  const matches=DB.matches().slice().sort((a,b)=>a.date.localeCompare(b.date));
  matches.forEach(m=>{
    const t1=[...m.team1], t2=[...m.team2];
    const avgA=(getEloFromList(players,t1[0])+getEloFromList(players,t1[1]))/2;
    const avgB=(getEloFromList(players,t2[0])+getEloFromList(players,t2[1]))/2;
    const expA=expectedScore(avgA,avgB);
    const [sA,sB]=m.winner===1?[1,0]:[0,1];
    t1.forEach(id=>{ const p=players.find(x=>x.id===id); if(p){ p.elo=Math.round(p.elo+ELO_K*(sA-expA)); }});
    t2.forEach(id=>{ const p=players.find(x=>x.id===id); if(p){ p.elo=Math.round(p.elo+ELO_K*(sB-(1-expA))); }});
  });
  DB.setPlayers(players);
}

function getEloFromList(list,id){ return list.find(p=>p.id===id)?.elo??1000; }

function playerStats(pid){
  const matches=DB.matches();
  let w=0,l=0,gw=0,gl=0;

  const form=[];
  const partnerMap={}, nemesisMap={};

  // sorted by date asc
  const sorted=matches.slice().sort((a,b)=>a.date.localeCompare(b.date));
  sorted.forEach(m=>{
    const inT1=m.team1.includes(pid), inT2=m.team2.includes(pid);
    if(!inT1&&!inT2)return;
    const won=(inT1&&m.winner===1)||(inT2&&m.winner===2);
    const myGames=inT1?(m.games1||0):(m.games2||0);
    const oppGames=inT1?(m.games2||0):(m.games1||0);
    if(won){w++;gw+=myGames;gl+=oppGames;}else{l++;gw+=myGames;gl+=oppGames;}
    form.push(won?'w':'l');

    // partner
    const partner=(inT1?m.team1:m.team2).find(x=>x!==pid);
    if(partner){
      if(!partnerMap[partner]) partnerMap[partner]={w:0,l:0};
      won?partnerMap[partner].w++:partnerMap[partner].l++;
    }
    // nemesis (opponents)
    const opps=(inT1?m.team2:m.team1);
    opps.forEach(oid=>{
      if(!nemesisMap[oid]) nemesisMap[oid]={w:0,l:0};
      won?nemesisMap[oid].w++:nemesisMap[oid].l++;
    });
  });

  // streak (from most recent)
  const recent=form.slice().reverse();
  if(recent.length){
    streakType=recent[0];
    for(let r of recent){ if(r===streakType)streak++; else break; }
  }

  // best partner
  let bestPartner=null, bestWr=-1;
  Object.entries(partnerMap).forEach(([id,s])=>{
    const t=s.w+s.l; if(t<2)return;
    const wr=s.w/t;
    if(wr>bestWr){bestWr=wr;bestPartner={id,w:s.w,l:s.l,wr};}
  });

  // nemesis (most losses against)
  let nemesis=null, mostL=0;
  Object.entries(nemesisMap).forEach(([id,s])=>{
    if(s.l>mostL){mostL=s.l;nemesis={id,w:s.w,l:s.l};}
  });

  return {w,l,gw,gl,streak,streakType,form:form.slice(-5),bestPartner,nemesis};
}

// ROUND-ROBIN GENERATOR
// ══════════════════════════════════════
function generateRoundRobin(playerIds){
  // sort by ELO desc, snake-draft into pairs
  const sorted=[...playerIds].sort((a,b)=>getElo(b)-getElo(a));
  const pairs=[];
  // snake: 1+last, 2+last-1, ...
  let lo=0,hi=sorted.length-1;
  while(lo<hi){ pairs.push([sorted[lo],sorted[hi]]); lo++;hi--; }
  if(lo===hi) pairs.push([sorted[lo],sorted[lo]]); // odd man out (shouldn't happen with 8)

  // generate all match combos
  const matches=[];
  for(let i=0;i<pairs.length;i++){
    for(let j=i+1;j<pairs.length;j++){
      matches.push({id:uid(),team1:pairs[i],team2:pairs[j],games1:'',games2:'',done:false});
    }
  }
  return {pairs,matches};
}

// CONVOCAÇÃO
// ══════════════════════════════════════
function buildConvocacao(){
  const players=groupPlayers().slice().sort((a,b)=>(b.elo||1000)-(a.elo||1000));
  // snake draft pairs: 1+8, 2+7, 3+6, 4+5 (balanced)
  const pairs=[];
  let lo=0,hi=players.length-1;
  while(lo<hi){ pairs.push([players[lo],players[hi]]); lo++;hi--; }
  return pairs;
}

let listaActiveId=null;

function renderSessoes(){
  if(listaActiveId) return renderSessaoDetalhe(listaActiveId);
  return renderSessoesIndex();
}
const WD=['DOM','SEG','TER','QUA','QUI','SEX','SÁB'];
const MES=['JANEIRO','FEVEREIRO','MARÇO','ABRIL','MAIO','JUNHO','JULHO','AGOSTO','SETEMBRO','OUTUBRO','NOVEMBRO','DEZEMBRO'];
function wdShort(iso){ try{ return WD[new Date(iso+'T12:00:00').getDay()]; }catch(e){ return ''; } }
function mesCurto(iso){ try{ return MES[new Date(iso+'T12:00:00').getMonth()].slice(0,3); }catch(e){ return ''; } }

function sessionBadge(s,cnt){
  if(s.status==='active') return `<span class="pill pill-live"><span class="dot"></span>AO VIVO</span>`;
  if(s.status==='finished') return `<span class="pill pill-g">ENCERRADA</span>`;
  if(cnt>=8) return `<span class="pill" style="background:var(--line);color:var(--label);font-weight:400">COMPLETA</span>`;
  return `<span class="pill pill-o">ABERTA</span>`;
}
function sessionCard(s,past){
  const cnt=(s.confirmed||[]).length;
  const live=s.status==='active';
  return`<div class="card row" style="gap:16px;cursor:pointer;${live?'border:1.5px solid var(--orange);':''}${past?'opacity:.75;':''}" onclick="goToSession('${s.id}')">
    <div style="width:46px;flex-shrink:0">
      <div class="num" style="font-size:30px;line-height:.9">${dayNum(s.date)}</div>
      <div class="mono-md" style="letter-spacing:.12em">${wdShort(s.date)}</div>
    </div>
    <div style="width:1px;height:46px;background:var(--line);flex-shrink:0"></div>
    <div class="stack grow" style="gap:6px">
      <div class="trunc" style="font-size:17px;font-weight:700">${s.name?esc(s.name):'Sessão '+fmtDate(s.date)}</div>
      <div class="mono-md">${cnt}/8 confirmados</div>
    </div>
    ${sessionBadge(s,cnt)}
  </div>`;
}
function renderSessoesIndex(){
  const all=groupSessions().slice();
  const today=new Date().toISOString().slice(0,10);
  // chips de mês
  const meses=[...new Set(all.map(s=>s.date.slice(0,7)))].sort().reverse().slice(0,3);
  const chips=meses.map(m=>{
    const [y,mm]=m.split('-');
    return`<button class="tab ${listaMonth===m?'on':''}" onclick="setListaMonth('${m}')">${MES[parseInt(mm,10)-1]}</button>`;
  }).join('')+`<button class="tab ${listaMonth==='all'?'on':''}" onclick="setListaMonth('all')">TUDO</button>`;

  const filtered=listaMonth==='all'?all:all.filter(s=>s.date.slice(0,7)===listaMonth);
  const prox=filtered.filter(s=>s.status==='active'||(s.status!=='finished'&&s.date>=today)).sort((a,b)=>a.date.localeCompare(b.date));
  const ant=filtered.filter(s=>!(s.status==='active'||(s.status!=='finished'&&s.date>=today))).sort((a,b)=>b.date.localeCompare(a.date));

  const header=`<div class="stack" style="gap:14px;margin-bottom:16px">
    <div class="row">
      <div class="h1" style="font-size:24px">SESSÕES</div>
      <button class="btn btn-p btn-sm" onclick="openNewSessionModal()">${icon('plus',16)} Criar</button>
    </div>
    <div class="tabs wrap-x" style="flex-wrap:nowrap">${chips}</div>
  </div>`;

  if(!all.length) return header+emptyState('calendar','Nenhuma sessão ainda','Cria a primeira e chama a galera pra confirmar presença.','Criar sessão','openNewSessionModal()');
  if(!filtered.length) return header+emptyState('calendar','Nada nesse mês','Escolhe outro mês ou cria uma sessão nova.','Criar sessão','openNewSessionModal()');

  return header+`
    ${prox.length?`<div class="mono" style="margin-bottom:10px">Próximas</div><div class="stack-sm" style="margin-bottom:22px">${prox.map(s=>sessionCard(s,false)).join('')}</div>`:''}
    ${ant.length?`<div class="mono" style="margin-bottom:10px">Anteriores</div><div class="stack-sm">${ant.map(s=>sessionCard(s,true)).join('')}</div>`:''}`;
}
function setListaMonth(m){ listaMonth=m; render(); }

function renderSessaoDetalhe(sessionId){
  const session=DB.sessions().find(s=>s.id===sessionId);
  if(!session) { listaActiveId=null; return renderSessoesIndex(); }
  const me=DB.currentPlayer();
  const confirmed=session.confirmed||[];
  const souOrganizador=session.organizerId===me||isPresOrDono(me);

  const head=`<div class="row" style="margin-bottom:18px">
      <button class="btn btn-link" style="display:flex;align-items:center;gap:8px;color:var(--white)" onclick="closeListaDetail()">${icon('chevronLeft',20)}<span class="mono-md">SESSÃO</span></button>
      ${souOrganizador?'<span class="pill pill-w">ORGANIZADOR</span>':sessionBadge(session,confirmed.length)}
    </div>
    <div class="h1" style="font-size:24px;margin-bottom:6px">${session.name?esc(session.name).toUpperCase():'SESSÃO'}</div>
    <div class="mono-md" style="margin-bottom:16px">${dayNum(session.date)} ${mesCurto(session.date)} · ${wdShort(session.date)}</div>`;

  if(session.status==='active') return head+renderPairManager(session);

  if(session.status==='finished'){
    if(sessionFlow&&sessionFlow.sessionId===session.id&&sessionFlow._owner){
      if(!sessionFlow._destaques) sessionFlow._destaques=buildDestaques(session.id);
      return head+renderSessionFlow(session);
    }
    if(session.flowState){
      const tmp={...session.flowState,_owner:false};
      if(!tmp._destaques) tmp._destaques=buildDestaquesFromFlow(tmp,session);
      if(tmp._destaques) return head+renderDestaques(tmp._destaques,session.id);
    }
    return head+emptyState('check','Sessão encerrada','Confere a tua evolução para ver as partidas.');
  }

  // ── lista de presença ──
  const total=8, vagas=total-confirmed.length;
  const souConfirmado=confirmed.includes(me);
  const canStart=confirmed.length>=4;

  const barra='<div style="display:flex;gap:4px">'+Array.from({length:total},(_,i)=>
    `<span style="flex:1;height:10px;border-radius:999px;background:${i<confirmed.length?'var(--orange)':'var(--line)'}"></span>`).join('')+'</div>';

  const chips=confirmed.map(pid=>`<div class="line-item" style="display:flex;align-items:center;gap:10px;padding:12px 14px">
      ${avatar(getName(pid),30)}
      <div class="stack grow" style="gap:2px;min-width:0">
        <div class="trunc" style="font-size:14px;font-weight:600">${esc(getName(pid).split(' ')[0])}</div>
        <div class="mono" style="letter-spacing:.1em">N${eloToLevel(getElo(pid)).n}</div>
      </div>
      ${souOrganizador||pid===me?`<button class="btn btn-link" style="padding:2px" onclick="event.stopPropagation();removeFromList('${session.id}','${pid}')">${icon('x',16)}</button>`:''}
    </div>`).join('');
  const vagasHtml=Array.from({length:vagas},(_,i)=>`<div onclick="openConfirmModal('${session.id}')" style="border:1.5px dashed var(--line);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;cursor:pointer;color:var(--dim)">
      ${icon('plus',18)}<div class="mono" style="letter-spacing:.1em">VAGA ${confirmed.length+i+1}</div>
    </div>`).join('');

  return head+`
    <div class="panel stack" style="gap:14px;margin-bottom:18px">
      ${souConfirmado?`<div style="display:flex;align-items:center;gap:8px;color:var(--orange)">${icon('check',20)}<span style="font-size:17px;font-weight:700">Você está dentro</span></div>`:''}
      <div class="row">
        <div class="mono">${vagas===0?'LISTA COMPLETA':'CONFIRMADOS'}</div>
        <div class="num" style="font-size:26px">${confirmed.length}<span style="font-size:16px;color:var(--label);font-family:var(--fb)"> de ${total}</span></div>
      </div>
      ${barra}
    </div>
    <div class="mono" style="margin-bottom:12px">Na quadra</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:18px">${chips}${vagasHtml}</div>
    <div class="stack-sm">
      ${!souConfirmado&&vagas>0?`<button class="btn btn-p btn-full" onclick="openConfirmModal('${session.id}')">${icon('check',18)} Confirmar presença</button>`:''}
      ${canStart&&souOrganizador?`<button class="btn ${souConfirmado?'btn-o':'btn-p'} btn-full" onclick="startSession('${session.id}')">${icon('play',18)} Fechar lista e montar duplas</button>`:''}
      <div class="body-sm center">${vagas===0?'Lista cheia. Bora jogar.':vagas===1?'Última vaga. Chama alguém.':vagas+' vagas abertas. Chama a galera.'}${!canStart?' · Mínimo 4 pra começar.':''}</div>
    </div>`;
}

let pairsState=null;
let selectedPoolChip=null;
let selectedSlot=null; // {pi,pos} de um jogador "pego" para trocar/mover
let sessionFlow=null;  // { sessionId, onCourtIdx, pickSelected:[], matches:[], phase:'pick_first'|'pick_opponent'|'finished' }
let liveSessionCallback=null; // called after saveLiveMatch if session flow active

function startSession(sessionId){
  const ss=DB.sessions(); const s=ss.find(x=>x.id===sessionId);
  if(!s)return;
  const nPairs=Math.floor((s.confirmed||[]).length/2);
  s.status='active';
  s.organizerId=DB.currentPlayer(); // quem inicia controla a sessão
  s.pairs=Array.from({length:nPairs},()=>[null,null]);
  DB.setSessions(ss);
  // marca este dispositivo como o controlador, no modo de montar duplas
  sessionFlow={sessionId, _owner:true, phase:'editing'};
  pairsState=null; selectedPoolChip=null; selectedSlot=null;
  render();
}

function renderPairManager(session){
  const me=DB.currentPlayer();
  if(session.organizerId && session.organizerId===me && (!sessionFlow || sessionFlow.sessionId!==session.id)){
    sessionFlow = session.flowState ? {...session.flowState, sessionId:session.id, _owner:true}
                                    : {sessionId:session.id, _owner:true, phase:'editing'};
  }
  const isOwner = sessionFlow && sessionFlow.sessionId===session.id && sessionFlow._owner
    && (!session.organizerId || session.organizerId===me);

  if(isOwner && sessionFlow.phase!=='editing') return renderSessionFlow(session);
  if(!isOwner) return renderSpectator(session);
  if(session.pairsReady&&session.pairs&&session.pairs.every(p=>p[0]&&p[1])) return renderSavedPairs(session);

  const confirmed=session.confirmed||[];
  const nPairs=Math.floor(confirmed.length/2);
  if(nPairs<2){
    return`<div class="card row" style="margin-bottom:12px"><span class="body-sm grow">Precisa de 4 jogadores pra montar duplas. Agora são ${confirmed.length}.</span></div>
      <div class="stack-sm">
        <button class="btn btn-p btn-full" onclick="openConfirmModal('${session.id}')">${icon('plus',18)} Adicionar jogadores</button>
        <button class="btn btn-q btn-full" onclick="finishSession('${session.id}')">${icon('stop',18)} Encerrar sessão</button>
      </div>`;
  }

  const savedValid=Array.isArray(session.pairs)&&session.pairs.length&&session.pairs.every(p=>Array.isArray(p));
  const defaultPairs=Array.from({length:nPairs},()=>[null,null]);
  const pairs=pairsState||JSON.parse(JSON.stringify(savedValid?session.pairs:defaultPairs));
  if(!pairsState) pairsState=pairs;
  while(pairs.length<nPairs) pairs.push([null,null]);

  const assigned=pairs.flat().filter(Boolean);
  const pool=confirmed.filter(id=>!assigned.includes(id));
  const allFilled=pairs.every(p=>p[0]&&p[1]);

  // equilíbrio: diferença entre a média mais alta e a mais baixa
  const medias=pairs.filter(p=>p[0]&&p[1]).map(p=>Math.round((getElo(p[0])+getElo(p[1]))/2));
  const dif=medias.length>1?Math.max(...medias)-Math.min(...medias):0;
  const equilibrado=dif<=40;

  const chips=pool.length?pool.map(pid=>{
    const sel=selectedPoolChip===pid;
    return`<button onclick="selectPoolChip('${pid}')" style="display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:${sel?'700':'600'};
      background:${sel?'var(--orange)':'transparent'};color:${sel?'var(--ink)':'var(--white)'};border:1.5px solid ${sel?'var(--orange)':'var(--line)'}">
      ${esc(getName(pid).split(' ')[0])}<span style="font-family:var(--fm);font-weight:700;font-size:12px;${sel?'':'color:var(--label)'}">${getElo(pid)}</span></button>`;
  }).join(''):`<span class="body-sm">Todos escalados</span>`;

  const slot=(pi,pos,pid)=>{
    if(!pid) return`<div onclick="assignToPair(${pi},${pos})" style="flex:1;border:1.5px dashed var(--line);border-radius:16px;padding:13px 14px;display:flex;align-items:center;gap:8px;cursor:pointer;color:var(--dim);min-width:0">
      ${icon('plus',16)}<span class="mono" style="letter-spacing:.1em">VAGA</span></div>`;
    const sel=selectedSlot&&selectedSlot.pi===pi&&selectedSlot.pos===pos;
    return`<div onclick="tapAssigned(${pi},${pos})" style="flex:1;background:var(--ink);border-radius:16px;padding:13px 14px;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;min-width:0;${sel?'border:1.5px solid var(--orange);':'border:1.5px solid transparent;'}">
      <div class="stack" style="gap:3px;min-width:0">
        <div class="trunc" style="font-size:15px;font-weight:${sel?'700':'600'};${sel?'color:var(--orange)':''}">${esc(getName(pid).split(' ')[0])}</div>
        <div class="mono" style="letter-spacing:.05em">${getElo(pid)} · N${eloToLevel(getElo(pid)).n}</div>
      </div>
      <button class="btn btn-link" style="padding:0;color:var(--label)" onclick="event.stopPropagation();removePairPlayer(${pi},${pos})">${icon('x',16)}</button>
    </div>`;
  };

  const cards=pairs.map((pair,pi)=>{
    const media=(pair[0]&&pair[1])?Math.round((getElo(pair[0])+getElo(pair[1]))/2):null;
    return`<div class="card stack" style="gap:12px">
      <div class="row"><div class="mono">DUPLA ${pi+1}</div><div class="mono-md">${media?'MÉDIA '+media:'—'}</div></div>
      <div style="display:flex;gap:8px">${slot(pi,0,pair[0])}${slot(pi,1,pair[1])}</div>
    </div>`;
  }).join('');

  const pego=selectedPoolChip?getName(selectedPoolChip).split(' ')[0]
            :(selectedSlot&&pairs[selectedSlot.pi]&&pairs[selectedSlot.pi][selectedSlot.pos]?getName(pairs[selectedSlot.pi][selectedSlot.pos]).split(' ')[0]:null);

  return`
    <div class="row" style="margin-bottom:16px">
      <span class="mono-md">MONTAR DUPLAS</span>
      ${medias.length>1?`<span class="pill ${equilibrado?'pill-o':'pill-g'}">${equilibrado?'EQUILIBRADO':'DESNIVELADO'}</span>`:''}
    </div>

    ${medias.length>1?`<div class="panel row" style="padding:14px 18px;margin-bottom:12px">
      <div class="stack" style="gap:4px">
        <div class="mono">DIFERENÇA MÁXIMA</div>
        <div class="body-sm">${equilibrado?'Duplas parelhas. Jogo aberto.':'Dá pra equilibrar melhor.'}</div>
      </div>
      <div style="font-family:var(--fd);font-size:26px;letter-spacing:-.03em;color:var(--orange)">${dif}</div>
    </div>`:''}

    <div style="display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap">
      <button class="btn btn-o btn-sm" onclick="sugestaoElo('${session.id}')">${icon('zap',16)} Sugerir duplas por ELO</button>
      <button class="btn btn-q btn-sm" onclick="openConfirmModal('${session.id}')">${icon('plus',16)} Jogador</button>
    </div>

    <div class="mono" style="margin-bottom:10px">Pool · ${pool.length} fora</div>
    <div style="display:flex;gap:7px;flex-wrap:wrap;margin-bottom:20px">${chips}</div>

    <div class="stack-sm" style="margin-bottom:16px">${cards}</div>

    ${pego?`<div class="mono" style="color:var(--orange);display:flex;align-items:center;gap:7px;margin-bottom:14px">${icon('cycle',14)} TROCAR ${esc(pego.toUpperCase())} DE LUGAR</div>`
          :`<div class="body-sm" style="margin-bottom:14px">Toca num jogador pra pegar, depois toca noutro pra trocar de lugar.</div>`}

    <div class="stack-sm">
      ${allFilled?`<button class="btn btn-p btn-full" onclick="savePairs('${session.id}')">${icon('check',18)} Confirmar duplas</button>`:''}
      <button class="btn btn-q btn-full" onclick="resetPairs('${session.id}')">${icon('cycle',18)} Limpar</button>
    </div>`;
}

function renderSavedPairs(session){
  const cards=(session.pairs||[]).map((pair,i)=>{
    const media=Math.round((getElo(pair[0])+getElo(pair[1]))/2);
    return`<div class="card stack" style="gap:12px">
      <div class="row"><div class="mono">DUPLA ${i+1}</div><div class="mono-md">MÉDIA ${media}</div></div>
      <div style="display:flex;gap:8px">${pair.map(pid=>`
        <div style="flex:1;background:var(--ink);border-radius:16px;padding:13px 14px;min-width:0">
          <div class="trunc" style="font-size:15px;font-weight:600">${esc(getName(pid).split(' ')[0])}</div>

function selectPoolChip(pid){
  selectedSlot=null;
  selectedPoolChip=selectedPoolChip===pid?null:pid;

// Toque num jogador já atribuído: substitui (se tiver um do pool selecionado),
// troca (se já tiver outro jogador "pego"), ou "pega" ele para trocar/mover.
function tapAssigned(pi,pos){
  if(!pairsState)return;
  if(selectedPoolChip){
    pairsState[pi][pos]=selectedPoolChip; // o anterior volta pro pool automaticamente
    selectedPoolChip=null; selectedSlot=null; render(); return;
  }
  if(selectedSlot){
    if(selectedSlot.pi===pi&&selectedSlot.pos===pos){ selectedSlot=null; render(); return; } // soltar
    const a=pairsState[selectedSlot.pi][selectedSlot.pos];
    pairsState[selectedSlot.pi][selectedSlot.pos]=pairsState[pi][pos];
    pairsState[pi][pos]=a;
    selectedSlot=null; render(); return;
  }
  selectedSlot={pi,pos}; render();
}

function assignToPair(pairIdx,pos){
  if(!pairsState)return;
  if(selectedPoolChip){
    pairsState[pairIdx][pos]=selectedPoolChip;
    selectedPoolChip=null; selectedSlot=null; render(); return;
  }
  if(selectedSlot){
    pairsState[pairIdx][pos]=pairsState[selectedSlot.pi][selectedSlot.pos];
    pairsState[selectedSlot.pi][selectedSlot.pos]=null;
    selectedSlot=null; render(); return;
  }
}

function removePairPlayer(pairIdx,pos){
  if(!pairsState)return;
  pairsState[pairIdx][pos]=null;
  selectedSlot=null;
  render();
}

function sugestaoElo(sessionId){
  const session=DB.sessions().find(s=>s.id===sessionId);
  if(!session)return;
  const confirmed=session.confirmed||[];
  // snake-draft: sort by ELO desc, pair 1st+last, 2nd+2nd-last...
  const sorted=[...confirmed].sort((a,b)=>getElo(b)-getElo(a));
  const nPairs=Math.floor(sorted.length/2);
  const newPairs=Array.from({length:nPairs},()=>[null,null]);
  let lo=0,hi=sorted.length-1,pi=0;
  while(lo<hi&&pi<nPairs){ newPairs[pi]=[sorted[lo],sorted[hi]]; lo++;hi--;pi++; }
  pairsState=newPairs;
  selectedPoolChip=null; selectedSlot=null;
  render();
}

function savePairs(sessionId){
  const ss=DB.sessions(); const s=ss.find(x=>x.id===sessionId);
  if(!s||!pairsState)return;
  s.pairs=JSON.parse(JSON.stringify(pairsState));
  s.pairsReady=true;
  DB.setSessions(ss);
  selectedSlot=null; selectedPoolChip=null;
  // se estávamos editando no meio dos jogos, volta para onde paramos
  if(sessionFlow&&sessionFlow._resumePhase){
    sessionFlow.phase=sessionFlow._resumePhase;
    delete sessionFlow._resumePhase;
    sessionFlow.pickSelected=[];
    persistFlowState(sessionId);
  }
  render();
}

function resetPairs(sessionId){
  const s=sessionId?DB.sessions().find(x=>x.id===sessionId):null;
  const nPairs=s?Math.floor((s.confirmed||[]).length/2):4;
  pairsState=Array.from({length:nPairs},()=>[null,null]);
  selectedPoolChip=null; selectedSlot=null;
  render();
}

function sf_confirmRule(){
  if(sessionFlow){ sessionFlow.phase='pick_first'; render(); }
}

function toggleFlowPick(idx){
  if(!sessionFlow)return;
  const sf=sessionFlow;
  const max=sf.phase==='pick_first'?2:1;
  if(sf.pickSelected.includes(idx)){
    sf.pickSelected=sf.pickSelected.filter(i=>i!==idx);
  } else {
    if(sf.pickSelected.length<max) sf.pickSelected.push(idx);
    else sf.pickSelected=[idx];
  }
  render();
}

function startFlowMatch(){
  if(!sessionFlow)return;
  const sf=sessionFlow;
  const session=DB.sessions().find(s=>s.id===sf.sessionId);
  if(!session)return;
  const pairs=session.pairs;

  let p1Idx,p2Idx;
  if(sf.phase==='pick_first'){ [p1Idx,p2Idx]=sf.pickSelected; }
  else { p1Idx=sf.onCourtIdx; p2Idx=sf.pickSelected[0]; }

  _launchFlowMatch(session, p1Idx, p2Idx);
}

function startRotationMatch(){
  if(!sessionFlow||sessionFlow.phase!=='rotation')return;
  const [rp1,rp2]=sessionFlow._rotationPairs;
  sessionFlow.onCourtIdx=rp1;
  sessionFlow.kingRun=[];
  sessionFlow._rotationPairs=null;
  const session=DB.sessions().find(s=>s.id===sessionFlow.sessionId);
  _launchFlowMatch(session, rp1, rp2);
}

function _launchFlowMatch(session, p1Idx, p2Idx){
  const sf=sessionFlow;
  const team1=session.pairs[p1Idx];
  const team2=session.pairs[p2Idx];

  liveSessionCallback=(winnerTeam, g1, g2)=>{
    const winnerPairIdx=winnerTeam===1?p1Idx:p2Idx;
    const loserPairIdx=winnerTeam===1?p2Idx:p1Idx;
    sf.matches.push({pair1Idx:p1Idx,pair2Idx:p2Idx,winner:winnerTeam,score1:g1,score2:g2});

    // Rodízio rule: track king's consecutive wins
    if(sf.rule==='rodizio'){
      if(winnerPairIdx===sf.onCourtIdx||sf.phase==='pick_first'){
        sf.kingRun=[...(sf.kingRun||[]),loserPairIdx];
        if(sf.kingRun.length>=session.pairs.length-1){
          // King beat everyone — trigger rotation
          const allIdx=session.pairs.map((_,i)=>i);
          const waiting=allIdx.filter(i=>i!==sf.onCourtIdx&&i!==loserPairIdx);
          sf._rotationPairs=[...waiting];
          sf.phase='rotation';
          sf.pickSelected=[];
          liveSessionCallback=null;
          persistFlowState(sf.sessionId);
          render(); return;
        }
      } else {
        // New king — reset run
        sf.kingRun=[loserPairIdx];
      }
    }

    sf.onCourtIdx=winnerPairIdx;
    sf.pickSelected=[];
    sf.phase='pick_opponent';
    liveSessionCallback=null;
    persistFlowState(sf.sessionId);
    render();
  };

  const serveOrder=[team1[0],team2[0],team1[1],team2[1]].filter(Boolean);
  liveMatch={
    team1, team2,
    format:1,
    targetGames:sf.targetGames,
    tiebreakPoints:sf.tiebreakPoints,
    scoring:sf.scoring||'games',
    serveOrder, currentServer:serveOrder[0]||null, serveLog:[],
    sets:[{t1:0,t2:0,p1:0,p2:0}],
    completedSets:[],
    status:'playing',
    winner:null,
    history:[],
    startedAt:Date.now(),
  };
  liveSeconds=0;
  if(liveTimer)clearInterval(liveTimer);
  liveTimer=setInterval(()=>{ liveSeconds++; updateTimer(); },1000);
  document.getElementById('live-overlay').classList.remove('hidden');
  persistFlowState(sf.sessionId);
  persistLiveScore(sf.sessionId);
  renderLiveInner();
}

function editPairsInFlow(sessionId){
  // Vai para o editor de duplas mantendo o fluxo; ao salvar, retoma de onde parou
  const s=DB.sessions().find(x=>x.id===sessionId);
  pairsState=s&&Array.isArray(s.pairs)?JSON.parse(JSON.stringify(s.pairs)):null;
  const ss=DB.sessions(); const sess=ss.find(x=>x.id===sessionId);
  if(sess){ sess.pairsReady=false; DB.setSessions(ss); }
  if(sessionFlow){
    if(!sessionFlow._resumePhase&&sessionFlow.phase!=='editing') sessionFlow._resumePhase=sessionFlow.phase;
    sessionFlow.phase='editing'; sessionFlow._owner=true; sessionFlow.sessionId=sessionId;
  } else {
    sessionFlow={sessionId,_owner:true,phase:'editing'};
  }
  selectedSlot=null; selectedPoolChip=null;
  render();
}

function finishSession(sessionId){
  const pid=DB.currentPlayer();
  const isOwner=sessionFlow&&sessionFlow.sessionId===sessionId&&sessionFlow._owner;
  if(!isPresOrDono(pid)&&!isOwner){ alert('Apenas presidentes e o dono podem encerrar a sessão.'); return; }
  if(!confirm('Finalizar a sessão agora?'))return;
  const ss=DB.sessions(); const s=ss.find(x=>x.id===sessionId);
  if(s){ s.status='finished'; DB.setSessions(ss); }
  if(sessionFlow){
    sessionFlow.phase='finished';
    sessionFlow._destaques=buildDestaques(sessionId);
    persistFlowState(sessionId);
  }
  // Limpa live score do Supabase
  if(supa) supa.from('sessions').update({live_score:null}).eq('id',sessionId).then(()=>{});
  render();
}

// Salva estado do fluxo no Supabase para outros dispositivos verem
function persistFlowState(sessionId){
  if(!supa)return;
  const ss=DB.sessions(); const s=ss.find(x=>x.id===sessionId);
  if(!s||!sessionFlow)return;
  const {_destaques,_owner,...flowClean}=sessionFlow;
  s.flowState=flowClean;
  DB._s('sessions',ss);
  supa.from('sessions').update({flow_state:flowClean}).eq('id',sessionId)
    .then(({error})=>{ if(error)console.warn('persist flow:',error); });
}

// Salva placar ao vivo ponto a ponto
function persistLiveScore(sessionId){
  if(!supa||!liveMatch)return;
  const cur=liveMatch.sets[liveMatch.sets.length-1];
  const tgt=liveMatch.targetGames||6;
  const inTb=cur.t1>=tgt&&cur.t2>=tgt;
  const score={
    team1:liveMatch.team1, team2:liveMatch.team2,
    targetGames:liveMatch.targetGames, tiebreakPoints:liveMatch.tiebreakPoints,
    t1:inTb?(cur.tb1||0):cur.t1, t2:inTb?(cur.tb2||0):cur.t2,
    completedSets:liveMatch.completedSets,
    isTb:inTb, status:liveMatch.status, winner:liveMatch.winner,
    scoring:liveMatch.scoring||'games', games1:cur.t1, games2:cur.t2, p1:cur.p1||0, p2:cur.p2||0,
    server:liveMatch.currentServer||null,
  };
  const ss=DB.sessions(); const s=ss.find(x=>x.id===sessionId);
  if(s){ s.liveScore=score; DB._s('sessions',ss); }
  supa.from('sessions').update({live_score:score}).eq('id',sessionId)
    .then(({error})=>{ if(error)console.warn('persist score:',error); });
}

function buildDestaquesFromFlow(flow, session){
  if(!flow||!flow.matches||!flow.matches.length) return null;
  const savedFlow = sessionFlow;
  sessionFlow = flow;
  const d = buildDestaques(session.id);
  sessionFlow = savedFlow;
  return d;
}

function buildDestaques(sessionId){
  const session=DB.sessions().find(s=>s.id===sessionId);
  const sf=sessionFlow;
  if(!session||!sf||!sf.matches||!sf.matches.length) return null;
  const pairs=session.pairs;

  // MVP: player with most wins across all flow matches
  const winCount={};
  sf.matches.forEach(m=>{
    const winPair=m.winner===1?pairs[m.pair1Idx]:pairs[m.pair2Idx];
    (winPair||[]).forEach(pid=>{ winCount[pid]=(winCount[pid]||0)+1; });
  });
  const mvpId=Object.entries(winCount).sort((a,b)=>b[1]-a[1])[0]?.[0];
  const mvpWins=mvpId?winCount[mvpId]:0;

  // Dupla dominante: pair with most wins
  const pairWins={};
  sf.matches.forEach(m=>{
    const wi=m.winner===1?m.pair1Idx:m.pair2Idx;
    pairWins[wi]=(pairWins[wi]||0)+1;
  });
  const domIdx=Object.entries(pairWins).sort((a,b)=>b[1]-a[1])[0];
  const domPair=domIdx?pairs[parseInt(domIdx[0])]:null;
  const domWins=domIdx?domIdx[1]:0;

  // Partida mais disputada: smallest score gap
  let closestMatch=null, closestGap=999;
  sf.matches.forEach(m=>{
    const gap=Math.abs((m.score1||0)-(m.score2||0));
    if(gap<closestGap){ closestGap=gap; closestMatch=m; }
  });

  // Rei da Quadra: longest king run (tracked in sf.kingRun)
  // We look at the pair that was on court the most consecutively
  const streakMap={};
  let cur=null, curLen=0;
  sf.matches.forEach(m=>{
    const wi=m.winner===1?m.pair1Idx:m.pair2Idx;
    if(wi===cur){ curLen++; } else { cur=wi; curLen=1; }
    if(!streakMap[wi]||streakMap[wi]<curLen) streakMap[wi]=curLen;
  });
  const reiIdx=Object.entries(streakMap).sort((a,b)=>b[1]-a[1])[0];
  const reiPair=reiIdx?pairs[parseInt(reiIdx[0])]:null;
  const reiStreak=reiIdx?reiIdx[1]:0;

  return { mvpId, mvpWins, domPair, domWins, closestMatch, reiPair, reiStreak, pairs };
}

    (d.domPair?`Dupla: *${d.domPair.map(pid=>getName(pid).split(' ')[0]).join(' & ')}* (${d.domWins}V)\n`:'') +
    (d.reiPair&&d.reiStreak>1?`Rei da quadra: *${d.reiPair.map(pid=>getName(pid).split(' ')[0]).join(' & ')}* (${d.reiStreak} seguidas)\n`:'') +

// ── DESAFIOS (ladder) ──
function groupChallenges(){ const g=myGroupId(); return DB.challenges().filter(c=>c.group_id===g); }
function challengePoints(pid){ let p=0; groupChallenges().forEach(c=>{ if(c.status!=='done')return; if(c.winner===pid)p+=3; else if(c.from_id===pid||c.to_id===pid)p+=1; }); return p; }
function createChallenge(toId){
  const me=DB.currentPlayer(); if(!me||!toId||toId===me)return;
  const open=groupChallenges().some(c=>(c.status==='pending'||c.status==='accepted')&&((c.from_id===me&&c.to_id===toId)||(c.from_id===toId&&c.to_id===me)));
  if(open){ alert('Já existe um desafio em aberto com esse jogador.'); return; }
  const list=DB.challenges();
  list.push({id:uid(),group_id:myGroupId(),from_id:me,to_id:toId,status:'pending',winner:null,created_at:new Date().toISOString()});
  DB.setChallenges(list); render();
}
function _patchChallenge(id,patch){ const list=DB.challenges(); const c=list.find(x=>x.id===id); if(!c)return; Object.assign(c,patch); DB.setChallenges(list); render(); }
function acceptChallenge(id){ _patchChallenge(id,{status:'accepted'}); }
function declineChallenge(id){ _patchChallenge(id,{status:'declined'}); }
function resolveChallenge(id,winnerId){ _patchChallenge(id,{status:'done',winner:winnerId}); }
function cancelChallenge(id){
  if(!confirm('Cancelar este desafio?'))return;
  DB.setChallenges(DB.challenges().filter(c=>c.id!==id));
  if(supa) supa.from('challenges').delete().eq('id',id).then(()=>{});
  render();
}

function renderDesafios(){
  const me=DB.currentPlayer();
  const ch=groupChallenges();
  const incoming=ch.filter(c=>c.to_id===me&&c.status==='pending');
  const outgoing=ch.filter(c=>c.from_id===me&&c.status==='pending');
  const active=ch.filter(c=>c.status==='accepted'&&(c.from_id===me||c.to_id===me));
  const others=groupPlayers().filter(p=>p.id!==me);
  const board=groupPlayers().map(p=>({p,pts:challengePoints(p.id)})).filter(x=>x.pts>0).sort((a,b)=>b.pts-a.pts);
  const nivelDif=(a,b)=>Math.abs(eloToLevel(getElo(a)).n-eloToLevel(getElo(b)).n);
  let html='';

  // desafio em destaque (aceito, pronto pra jogar)
  if(active.length){
    html+=`<div class="mono" style="margin-bottom:10px">Pra jogar</div><div class="stack-sm" style="margin-bottom:22px">`;
    html+=active.map(c=>{
      const dif=nivelDif(c.from_id,c.to_id);
      return`<div class="card stack" style="gap:14px">
        <div class="row">
          <div style="font-size:17px;font-weight:700" class="trunc">${esc(getName(c.from_id).split(' ')[0])} → ${esc(getName(c.to_id).split(' ')[0])}</div>
          ${dif>0?`<span class="pill pill-o">${dif} ${dif===1?'NÍVEL':'NÍVEIS'}</span>`:''}
        </div>
        <div class="body-sm">Joguem e registrem quem venceu. Vitória vale 3 pontos, jogar vale 1.</div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          <button class="btn btn-p btn-sm" onclick="resolveChallenge('${c.id}','${c.from_id}')">${icon('check',16)} ${esc(getName(c.from_id).split(' ')[0])} venceu</button>
          <button class="btn btn-q btn-sm" onclick="resolveChallenge('${c.id}','${c.to_id}')">${esc(getName(c.to_id).split(' ')[0])} venceu</button>
        </div>
      </div>`;
    }).join('')+`</div>`;
  }

  if(incoming.length||outgoing.length){
    html+=`<div class="mono" style="margin-bottom:10px">Desafios abertos</div><div class="stack-sm" style="margin-bottom:22px">`;
    html+=incoming.map(c=>`<div class="line-item stack" style="gap:12px">
        <div class="row"><div class="trunc" style="font-size:16px;font-weight:600">${esc(getName(c.from_id))} te desafiou</div><span class="pill pill-o">PENDENTE</span></div>
        <div style="display:flex;gap:8px"><button class="btn btn-p btn-sm" onclick="acceptChallenge('${c.id}')">Aceitar</button><button class="btn btn-q btn-sm" onclick="declineChallenge('${c.id}')">Recusar</button></div>
      </div>`).join('');
    html+=outgoing.map(c=>`<div class="line-item row">
        <div class="stack" style="gap:4px;min-width:0"><div class="trunc" style="font-size:16px;font-weight:600">Você → ${esc(getName(c.to_id))}</div><div class="mono-md">AGUARDANDO RESPOSTA</div></div>
        <button class="btn btn-link" onclick="cancelChallenge('${c.id}')">${icon('x',18)}</button>
      </div>`).join('');
    html+=`</div>`;
  }

  if(board.length){
    html+=`<div class="mono" style="margin-bottom:10px">Placar de desafios</div><div class="stack-sm" style="margin-bottom:22px">`;
    html+=board.map((x,i)=>`<div class="line-item" style="display:flex;align-items:center;gap:14px">
        <div class="num" style="font-size:18px;width:26px;${i===0?'color:var(--orange)':''}">${i+1}</div>
        <div class="trunc grow" style="font-size:16px;font-weight:600">${esc(x.p.name)}</div>
        <div class="num" style="font-size:18px">${x.pts}</div><div class="mono">PTS</div>
      </div>`).join('')+`</div>`;
  }

  html+=`<div class="mono" style="margin-bottom:10px">Marcar desafio</div>`;
  if(!others.length) return html+emptyState('users','Ninguém pra desafiar','Convida a galera pro grupo primeiro.');
  html+=`<div class="stack-sm">`+others.map(p=>{
    const dif=nivelDif(me,p.id);
    return`<div class="line-item row">
      <div class="stack" style="gap:4px;min-width:0">
        <div class="trunc" style="font-size:16px;font-weight:600">${esc(p.name)}</div>
        <div class="mono-md">N${eloToLevel(p.elo).n}${dif>0?' · '+dif+(dif===1?' nível acima/abaixo':' níveis de diferença'):''}</div>
      </div>
      <button class="btn btn-p btn-sm" onclick="createChallenge('${p.id}')">${icon('arrowUp',16)} Desafiar</button>
    </div>`;
  }).join('')+`</div>`;
  return html;
}
function renderEloTable(){
  const players=groupPlayers().slice().sort((a,b)=>(b.elo||1000)-(a.elo||1000));
  if(!players.length) return emptyState('trophy','Ranking vazio','Joguem a primeira sessão e o ranking aparece aqui.');
  const me=DB.currentPlayer();
  return'<div class="stack-sm">'+players.map((p,i)=>{
    const st=playerStats(p.id); const tot=st.w+st.l; const pct=tot?Math.round(st.w/tot*100):0;
    const lead=i===0;
    const sub = st.streak>1
      ? `<span class="mono-md" style="color:${st.streakType==='w'?'var(--orange)':'var(--label)'}">${st.streak}${st.streakType==='w'?'V':'D'} seguidas</span>`
      : `<span class="mono-md" style="color:${pct>=50?'var(--orange)':'var(--label)'}">${tot?pct+'%':'—'}</span>`;

        <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">${levelCaps(p.elo)}<span class="mono" style="letter-spacing:.1em">N${eloToLevel(p.elo).n}</span>${p.role?roleBadge(p.id):''}</div>

        <div class="num" style="font-size:22px">${p.elo||1000}</div>${sub}
      </div>
    </div>`;
  }).join('')+'</div>';
}
function renderDuplasTable(){
  const map={};
  function key(t){return[...t].sort().join('|');}
  function dname(t){return t.map(getName).join(' + ');}
  groupMatches().forEach(m=>{
    const[wt,lt]=m.winner===1?[m.team1,m.team2]:[m.team2,m.team1];
    const[gw,gl]=m.winner===1?[m.games1,m.games2]:[m.games2,m.games1];
    const wk=key(wt),lk=key(lt);
    if(!map[wk])map[wk]={key:wk,name:dname(wt),w:0,l:0,gw:0,gl:0};
    if(!map[lk])map[lk]={key:lk,name:dname(lt),w:0,l:0,gw:0,gl:0};
    map[wk].w++;map[wk].gw+=(gw||0);map[wk].gl+=(gl||0);
    map[lk].l++;map[lk].gw+=(gl||0);map[lk].gl+=(gw||0);
  });
  const data=Object.values(map).sort((a,b)=>b.w!==a.w?b.w-a.w:b.gw-a.gw);
  if(!data.length) return emptyState('users','Sem duplas ainda','Depois da primeira sessão as duplas aparecem aqui.');
  return'<div class="stack-sm">'+data.map((d,i)=>{
    const tot=d.w+d.l; const pct=tot?Math.round(d.w/tot*100):0;
    if(i===0){
      const parts=d.name.split(' + ').map(x=>esc(x).toUpperCase());
      return`<div style="background:var(--orange);border-radius:20px;padding:20px;display:flex;flex-direction:column;gap:12px">
        <div style="font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--ink)">DUPLA MAIS FORTE</div>
        <div style="font-family:var(--fd);font-size:30px;line-height:1;letter-spacing:-.03em;color:var(--ink)">${parts.join('<br>+ ')}</div>
        <div class="row" style="border-top:1.5px solid var(--ink);padding-top:12px">
          <div style="font-family:var(--fm);font-weight:700;font-size:13px;letter-spacing:.1em;color:var(--ink)">${d.w}V · ${d.l}D</div>
          <div style="font-family:var(--fd);font-size:24px;color:var(--ink)">${pct}%</div>
        </div>
      </div>`;
    }
    return`<div class="line-item" style="display:flex;align-items:center;gap:14px">
      <div class="num" style="font-size:18px;width:26px;flex-shrink:0">${i+1}</div>
      <div class="trunc grow" style="font-size:16px;font-weight:600">${esc(d.name)}</div>
      <div class="mono-md" style="white-space:nowrap">${d.w}V · ${d.l}D</div>
      <div class="num" style="font-size:18px">${pct}%</div>
    </div>`;
  }).join('')+'</div>';
}

// Estatística de saque (modo avançado): quantas vezes confirmou o saque e quantas foi quebrado
function playerServeStats(pid){
  let served=0, held=0, broken=0;
  groupMatches().forEach(m=>{
    (m.serveLog||[]).forEach(e=>{
      if(e.serverId===pid){ served++; if(e.held) held++; else broken++; }
    });
  });
  return {served, held, broken};
}

function saveManualGame(){
  const msg=document.getElementById('mg-msg'); const err=t=>{ if(msg) msg.textContent=t; };
  const date=document.getElementById('mg-date').value;
  if(!date){ err('Escolha a data.'); return; }
  const myPair=cleanName(document.getElementById('mg-mypair').value)||'Minha dupla';
  const oppPair=cleanName(document.getElementById('mg-opppair').value)||'Adversária';
  const myScore=parseInt(document.getElementById('mg-my').value,10);
  const oppScore=parseInt(document.getElementById('mg-opp').value,10);
  if(isNaN(myScore)||isNaN(oppScore)){ err('Preencha o placar dos dois lados.'); return; }
  if(myScore===oppScore){ err('O placar não pode dar empate.'); return; }
  const note=cleanName(document.getElementById('mg-note').value).slice(0,60);
  const g={ id:uid(), user:DB.authUserId(), date, myPair, oppPair,
    mode:manualMode, target:manualTarget, myScore, oppScore,
    result:myScore>oppScore?'win':'loss', note, created_at:new Date().toISOString() };
  const list=DB.manualGames(); list.push(g); DB.setManualGames(list);
  closeModal('modal-manual-game');
  render();
}
function deleteManualGame(id){
  if(!confirm('Apagar este jogo?'))return;
  DB.setManualGames(DB.manualGames().filter(g=>g.id!==id));
  render();
}
