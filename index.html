function setFmt(f){ liveFormat=f; renderLiveInner(); }

function startLive(){
  const t1p1=document.getElementById('lv-t1p1')?.value;
  const t1p2=document.getElementById('lv-t1p2')?.value;
  const t2p1=document.getElementById('lv-t2p1')?.value;
  const t2p2=document.getElementById('lv-t2p2')?.value;
  if(!t1p1||!t1p2||!t2p1||!t2p2){alert('Selecione todos os 4 jogadores.');return;}
  if(new Set([t1p1,t1p2,t2p1,t2p2]).size<4){alert('Selecione 4 jogadores diferentes.');return;}

  liveMatch={
    team1:[t1p1,t1p2],
    team2:[t2p1,t2p2],
    format:liveFormat,
    sets:[{t1:0,t2:0}],        // sets[last] = current set in progress
    completedSets:[],           // [{t1,t2,won:1|2}]
    status:'playing',
    winner:null,
    history:[],                 // for undo
    startedAt:Date.now(),
  };
  liveSeconds=0;
  if(liveTimer)clearInterval(liveTimer);
  liveTimer=setInterval(()=>{ liveSeconds++; updateTimer(); },1000);
  renderLiveInner();
}

function updateTimer(){
  const el=document.getElementById('live-clock');
  if(el) el.textContent=fmtTimer(liveSeconds);
}
function fmtTimer(s){ const m=Math.floor(s/60),sc=s%60; return`${String(m).padStart(2,'0')}:${String(sc).padStart(2,'0')}`; }

// ── SCOREBOARD ──
function buildScoreboard(){
  if(!liveMatch)return'';
  const m=liveMatch;
  const cur=m.sets[m.sets.length-1];
  const sets1won=m.completedSets.filter(s=>s.won===1).length;
  const sets2won=m.completedSets.filter(s=>s.won===2).length;
  const tgt=m.targetGames||6;
  const inTb=cur.t1>=tgt&&cur.t2>=tgt;
  const tb1=cur.tb1||0, tb2=cur.tb2||0;
  const disp1=inTb?tb1:cur.t1, disp2=inTb?tb2:cur.t2;
  const isPoints=(m.scoring||'games')==='points'&&!inTb;
  const PTS=['0','15','30','40'];
  const pt1=PTS[Math.min(cur.p1||0,3)], pt2=PTS[Math.min(cur.p2||0,3)];
  const t1winning=isPoints?(cur.p1||0)>(cur.p2||0):disp1>disp2;
  const t2winning=isPoints?(cur.p2||0)>(cur.p1||0):disp2>disp1;

  const t1names=m.team1.map(getName).join('\n');
  const t2names=m.team2.map(getName).join('\n');

  // simulação de ranking (ELO em jogo)
  const stk=eloStakes(m.team1,m.team2);
  const stakeLine=(win,lose)=>stk?`<div style="font-family:var(--font-m);font-size:11px;letter-spacing:.5px;margin-bottom:8px"><span style="color:var(--success)">▲${win>=0?'+':''}${win}</span> <span style="color:var(--n500)">/</span> <span style="color:var(--danger)">▼${lose}</span></div>`:'';

  // sets pills
  const setsPills=m.completedSets.map(s=>{
    const t1w=s.won===1;
    const hasTb=s.tb1!==undefined;
    return`<div class="set-score-pill won" style="${t1w?'':'opacity:.5'}">${s.t1}${hasTb?`<sup style="font-size:14px;margin-left:1px">TB</sup>`:''}${hasTb?`<span style="font-size:14px;margin-left:2px">${s.tb1}</span>`:''}</div>
           <div class="sets-sep">·</div>
           <div class="set-score-pill won" style="${!t1w?'':'opacity:.5'}">${s.t2}${hasTb?`<span style="font-size:14px;margin-left:2px">${s.tb2}</span>`:''}</div>
           <div class="sets-sep" style="margin:0 4px">|</div>`;
  }).join('')+(inTb
    ?`<div class="set-score-pill current" style="border-color:var(--gold);color:var(--n400);font-size:14px">${cur.t1}·${cur.t2}</div><div class="sets-sep" style="color:var(--gold);font-weight:700">TB</div><div class="set-score-pill current" style="border-color:var(--gold);color:var(--gold)">${tb1}</div><div class="sets-sep">·</div><div class="set-score-pill current" style="border-color:var(--gold);color:var(--gold)">${tb2}</div>`
    :`<div class="set-score-pill current">${cur.t1}</div><div class="sets-sep">·</div><div class="set-score-pill current">${cur.t2}</div>`);

  const setsLabel=m.format===3?`MELHOR DE 3 · SET ${m.completedSets.length+1}`:'1 SET';
  const score1Ind=Array(sets1won).fill('●').join(' ');
  const score2Ind=Array(sets2won).fill('●').join(' ');

  const winTeam=m.winner===1?m.team1:m.team2;
  const sW=m.completedSets.filter(s=>s.won===m.winner).length;
  const sL=m.completedSets.filter(s=>s.won!==(m.winner===1?2:1)).length;
  const finishedOverlay=m.status==='finished'?`
    <div style="position:absolute;inset:0;background:var(--ink);display:flex;flex-direction:column;justify-content:center;gap:16px;padding:20px;z-index:10;overflow-y:auto">
      <div class="mono-md">GAME ENCERRADO</div>
      <div style="background:var(--orange);border-radius:24px;padding:22px 20px;display:flex;flex-direction:column;gap:16px">
        <div style="font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.18em;color:var(--ink)">VENCERAM</div>
        <div style="font-family:var(--fd);font-size:34px;line-height:1;letter-spacing:-.035em;color:var(--ink)">${winTeam.map(pid=>esc(getName(pid).split(' ')[0])).join('<br>+ ')}</div>
        <div style="display:flex;align-items:flex-end;justify-content:space-between">
          <div style="font-family:var(--fm);font-weight:700;font-size:12px;letter-spacing:.12em;color:var(--ink)">GAMES</div>
          <div style="font-family:var(--fd);font-size:52px;line-height:.8;letter-spacing:-.05em;color:var(--ink)">${placar(Math.max(cur.t1,cur.t2),Math.min(cur.t1,cur.t2))}</div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <button class="btn btn-p btn-full" onclick="saveLiveMatch()">${icon('save',18)} Salvar no histórico</button>
        <button class="btn btn-q btn-full" onclick="discardLive()">Descartar</button>
      </div>
    </div>`:'';

  const pips=(won,cor)=>{let s='<div style="display:flex;gap:4px">';const n=Math.max(tgt,6);
    for(let i=0;i<n;i++) s+=`<span style="width:20px;height:6px;border-radius:999px;background:${i<won?cor:'var(--line)'};display:block"></span>`;
    return s+'</div>';};
  const srv1=isPoints&&m.currentServer&&m.team1.includes(m.currentServer);
  const srv2=isPoints&&m.currentServer&&m.team2.includes(m.currentServer);
  const sacando=`<span style="display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--orange);color:var(--orange);border-radius:999px;padding:4px 11px;width:fit-content;font-family:var(--fm);font-size:11px;font-weight:700;letter-spacing:.14em">${icon('arrowUp',13,'var(--orange)')}SACANDO</span>`;
  const big1=isPoints?pt1:(inTb?tb1:disp1);
  const big2=isPoints?pt2:(inTb?tb2:disp2);
  const modo=isPoints?'AVANÇADA':(inTb?'TIEBREAK':'BÁSICA');
  const gameNo=(cur.t1||0)+(cur.t2||0)+1;
  const mostraGames=isPoints||inTb;

  const painel=(time,big,cor,srv)=>{
    const nomes=(time===1?m.team1:m.team2).map(getName).map(n=>esc(n.split(' ')[0])).join('<br>');
    const games=time===1?cur.t1:cur.t2;
    const rad=time===1?'20px 20px 4px 4px':'4px 4px 20px 20px';
    const base=`<div style="display:flex;align-items:center;justify-content:${mostraGames?'space-between':'flex-end'}">
        ${mostraGames?`<div class="mono-md" style="letter-spacing:.14em">GAMES</div>
        <div style="display:flex;align-items:center;gap:10px"><div class="num" style="font-size:30px">${games}</div>${pips(games,cor)}</div>`
        :pips(games,cor)}
      </div>`;
    return`<div onclick="addGame(${time})" style="flex:1;background:var(--surf);border-radius:${rad};padding:22px 20px;display:flex;flex-direction:column;justify-content:space-between;gap:18px;cursor:pointer;-webkit-tap-highlight-color:transparent;min-height:0">
      <div style="display:flex;align-items:flex-start;justify-content:space-between;gap:12px">
        <div class="stack" style="gap:8px;min-width:0">
          <div style="font-size:20px;font-weight:700;line-height:1.2">${nomes}</div>
          ${srv?sacando:''}
        </div>
        <div style="font-family:var(--fd);font-size:92px;line-height:.8;letter-spacing:-.05em;color:${cor}">${big}</div>
      </div>
      ${base}
    </div>`;
  };

  const seletorSaque=(isPoints&&(m.serveOrder||[]).length)?`<div style="display:flex;align-items:center;gap:6px;padding:0 20px 10px;flex-wrap:wrap;justify-content:center">
      <span class="mono" style="letter-spacing:.1em">SAQUE</span>
      ${(m.serveOrder||[]).map(pid=>`<button onclick="setServer('${pid}')" style="border:1.5px solid ${m.currentServer===pid?'var(--orange)':'var(--line)'};color:${m.currentServer===pid?'var(--orange)':'var(--label)'};font-family:var(--fm);font-size:11px;font-weight:600;padding:5px 12px;border-radius:999px">${esc(getName(pid).split(' ')[0])}</button>`).join('')}
    </div>`:'';

  return`
    <div class="row" style="padding:18px 20px 14px;flex-shrink:0">
      <button class="btn btn-link" style="display:flex;align-items:center;gap:8px;color:var(--white)" onclick="closeLive()">
        ${icon('chevronLeft',20)}<span class="mono-md" id="live-clock">${fmtTimer(liveSeconds)}</span></button>
      ${m.status==='playing'?'<span class="pill pill-live"><span class="dot"></span>AO VIVO</span>'
        :'<span class="pill pill-g" style="color:var(--orange);border-color:var(--orange)">ENCERRADA</span>'}
    </div>

    <div style="padding:0 20px 12px;flex-shrink:0">
      <div class="row" style="background:var(--surf);border-radius:999px;padding:6px 14px">
        <span class="mono-md">${modo}${m.format===3?' · '+setsLabel:''}</span>
        <span class="mono-md">${inTb?'TIEBREAK':'GAME '+gameNo}</span>
      </div>
    </div>
    ${seletorSaque}

    <div style="flex:1;display:flex;flex-direction:column;gap:2px;padding:0 20px;min-height:0;position:relative">
      ${painel(1,big1,'var(--orange)',srv1)}
      ${painel(2,big2,'var(--white)',srv2)}
      ${finishedOverlay}
    </div>

    ${inTb?`<div class="row" style="margin:12px 20px 0;background:var(--line);border-radius:16px;padding:12px 16px;flex-shrink:0">
      <span class="mono-md" style="font-weight:700;letter-spacing:.16em;color:var(--orange)">TIEBREAK · ${cur.t1}–${cur.t2}</span>
      <span class="mono-md">VAI ATÉ ${m.tiebreakPoints||7}</span>
    </div>`:''}

    <div style="padding:16px 20px 24px;display:flex;flex-direction:column;gap:10px;flex-shrink:0">
      <div style="display:flex;gap:10px">
        ${m.status==='playing'
          ?`<button class="btn btn-q" style="flex:1${!m.history.length?';opacity:.4':''}" onclick="undoGame()" ${!m.history.length?'disabled':''}>${icon('undo',18)} Desfazer</button>
            <button class="btn btn-d" style="flex:1" onclick="endMatchManual()">${icon('flag',18)} Encerrar</button>`
          :`<button class="btn btn-p" style="flex:1" onclick="saveLiveMatch()">${icon('save',18)} Salvar no histórico</button>`}
      </div>
      ${stk?`<div class="mono-md center">EM JOGO: ${Math.abs(stk.t1Win||stk.t2Win||0)} PONTOS DE ELO</div>`:''}
    </div>`;
}

// ── SCORING LOGIC ──
function addGame(team){
  if(!liveMatch||liveMatch.status!=='playing')return;
  const m=liveMatch;
  const cur=m.sets[m.sets.length-1];
  const tgt=m.targetGames||6;
  const tbPts=m.tiebreakPoints||7;

  // Deep snapshot for undo (inclui saque)
  m.history.push(JSON.stringify({sets:JSON.parse(JSON.stringify(m.sets)),completedSets:JSON.parse(JSON.stringify(m.completedSets)),serveLog:JSON.parse(JSON.stringify(m.serveLog||[])),currentServer:m.currentServer||null}));

  const inTb=cur.t1>=tgt&&cur.t2>=tgt;

  if(inTb){
    // In tiebreak: increment tiebreak points
    if(cur.tb1===undefined){cur.tb1=0;cur.tb2=0;}
    if(team===1)cur.tb1++;else cur.tb2++;
    let winner=null;
    if(cur.tb1>=tbPts&&cur.tb1-cur.tb2>=2)winner=1;
    if(cur.tb2>=tbPts&&cur.tb2-cur.tb1>=2)winner=2;
    if(winner){ _resolveSet(m,cur,winner); }
  } else if((m.scoring||'games')==='points'){
    // Conta pontos dentro do game: 15·30·40 e golden point (no-ad, 1º a 4 pontos leva o game)
    if(cur.p1===undefined){cur.p1=0;cur.p2=0;}
    if(team===1)cur.p1++;else cur.p2++;
    let gameWinner=null;
    if(cur.p1>=4)gameWinner=1; else if(cur.p2>=4)gameWinner=2;
    if(gameWinner){
      // Registra o saque: confirmado se o time do sacador venceu o game; senão, saque quebrado
      if(m.serveLog&&m.currentServer){
        const serverTeam=(m.team1||[]).includes(m.currentServer)?1:2;
        m.serveLog.push({serverId:m.currentServer, held:serverTeam===gameWinner});
        if(m.serveOrder&&m.serveOrder.length){
          const i=m.serveOrder.indexOf(m.currentServer);
          m.currentServer=m.serveOrder[(i+1)%m.serveOrder.length];
        }
      }
      if(gameWinner===1)cur.t1++;else cur.t2++;
      cur.p1=0;cur.p2=0;
      if(cur.t1===tgt&&cur.t2===tgt){cur.tb1=0;cur.tb2=0;}
      const setWinner=checkSetWinner(cur);
      if(setWinner){ _resolveSet(m,cur,setWinner); }
    }
  } else {
    // Só games: cada toque é um game
    if(team===1)cur.t1++;else cur.t2++;
    if(cur.t1===tgt&&cur.t2===tgt){cur.tb1=0;cur.tb2=0;}
    const setWinner=checkSetWinner(cur);
    if(setWinner){ _resolveSet(m,cur,setWinner); }
  }
  if(sessionFlow) persistLiveScore(sessionFlow.sessionId);
  renderLiveInner();
}

function setServer(pid){
  if(!liveMatch||liveMatch.status!=='playing')return;
  liveMatch.currentServer=pid;
  if(sessionFlow) persistLiveScore(sessionFlow.sessionId);
  renderLiveInner();
}

function _resolveSet(m,cur,winner){
  m.completedSets.push({...cur,won:winner});
  const sets1=m.completedSets.filter(s=>s.won===1).length;
  const sets2=m.completedSets.filter(s=>s.won===2).length;
  const setsToWin=m.format===1?1:2;
  if(sets1>=setsToWin||sets2>=setsToWin){
    m.winner=sets1>=setsToWin?1:2;
    m.status='finished';
    if(liveTimer){clearInterval(liveTimer);liveTimer=null;}
  } else {
    m.sets.push({t1:0,t2:0,p1:0,p2:0});
  }
}

function checkSetWinner(set){
  const{t1,t2}=set;
  const tgt=liveMatch?.targetGames||6;
  // Normal win only — tiebreak handled in addGame
  if(t1>=tgt&&t1-t2>=2)return 1;
  if(t2>=tgt&&t2-t1>=2)return 2;
  return null;
}

function undoGame(){
  if(!liveMatch||!liveMatch.history.length)return;
  const snap=JSON.parse(liveMatch.history.pop());
  liveMatch.sets=JSON.parse(JSON.stringify(snap.sets));
  liveMatch.completedSets=JSON.parse(JSON.stringify(snap.completedSets));
  if(snap.serveLog!==undefined) liveMatch.serveLog=JSON.parse(JSON.stringify(snap.serveLog));
  if(snap.currentServer!==undefined) liveMatch.currentServer=snap.currentServer;
  liveMatch.status='playing';
  liveMatch.winner=null;
  if(!liveTimer){ liveTimer=setInterval(()=>{ liveSeconds++; updateTimer(); },1000); }
  renderLiveInner();
}

function endMatchManual(){
  if(!confirm('Encerrar partida agora?'))return;
  if(liveMatch){
    liveMatch.status='finished';
    // Determine winner by current sets
    const s1=liveMatch.completedSets.filter(s=>s.won===1).length;
    const s2=liveMatch.completedSets.filter(s=>s.won===2).length;
    // Also count current set progress
    const cur=liveMatch.sets[liveMatch.sets.length-1];
    liveMatch.winner=s1>s2?1:s2>s1?2:cur.t1>=cur.t2?1:2;
    if(liveTimer){clearInterval(liveTimer);liveTimer=null;}
  }
  renderLiveInner();
}

function saveLiveMatch(){
  if(!liveMatch)return;
  const m=liveMatch;
  let g1=0,g2=0;
  m.completedSets.forEach(s=>{ g1+=s.t1; g2+=s.t2; });
  const cur=m.sets[m.sets.length-1];
  if(!m.completedSets.find(s=>s.t1===cur.t1&&s.t2===cur.t2)) { g1+=cur.t1; g2+=cur.t2; }

  const sessionId=sessionFlow?sessionFlow.sessionId:null;
  const date=new Date().toISOString().slice(0,10);
  const matches=DB.matches();
  matches.push({id:uid(),sessionId,date,team1:m.team1,team2:m.team2,games1:g1,games2:g2,winner:m.winner,group_id:myGroupId(),serveLog:(m.serveLog&&m.serveLog.length)?m.serveLog:null});
  DB.setMatches(matches);
  recalcAllElo();

  const winner=m.winner;
  const cb=liveSessionCallback;
  // stash scores for callback
  if(cb){ m._savedG1=g1; m._savedG2=g2; }

  liveMatch=null;
  closeLive();

  if(cb){ cb(winner); }
  else { render(); alert('Partida salva!'); }
}

function discardLive(){
  if(!confirm('Descartar esta partida?'))return;
  liveMatch=null;
  if(liveTimer){clearInterval(liveTimer);liveTimer=null;}
  closeLive();
}
